<script>
/* Theme before first paint — prevents a light flash in dark mode. */
(function () {
  var stored = null;
  try { stored = localStorage.getItem('theme'); } catch (e) {}
  if (stored === 'light' || stored === 'dark') document.documentElement.setAttribute('data-theme', stored);
})();

/* ===========================================================================

:root {

  --bg:           #FFFFFF;

  --surface-alt:  #F8FAFC;   /* slate-50  - publication cards */

                                slate-400 here, which is only 2.56:1 on white and
                                fails WCAG AA; slate-500 is 4.76:1 and at 12px
                                uppercase the two are all but indistinguishable. */
  --rule:         #E2E8F0;   /* slate-200 */
  --rule-strong:  #CBD5E1;   /* slate-300 */

  /* TWO cyans, on purpose.
     --accent is every accent that carries TEXT (links, buttons, nav, chips).
     It is cyan-700, which clears WCAG AA on white at 5.36:1.
     --grad-1 / --grad-2 are DECORATIVE ONLY - they appear solely in the large
     gradients (the name, the brand, section underlines, the photo ring), where
     the brighter cyan-600 -> indigo-500 pair can be used freely because no
     small text ever sits on them. */
  --accent:       #0E7490;   /* cyan-700   */
  --accent-hover: #155E75;   /* cyan-800   */
  --grad-1:       #0891B2;   /* cyan-600   */
  --grad-2:       #6366F1;   /* indigo-500 */
  --accent-soft:  #ECFEFF;   /* cyan-50    */
  --accent-ring:  rgba(8, 145, 178, .28);
  --on-accent:    #FFFFFF;

  --ink-strong:   #000000;   /* true black, used only for the hero role line */

  --contact-1:    #E8F1FD;   /* the blue wash behind Get In Touch */
  --contact-2:    #F5F9FE;

  --new-bg:       #FEF6DA;   /* amber wash behind the "New" badge */
  --new-line:     #E0A116;
  --new-ink:      #7A4E05;   /* 6.1:1 on --new-bg, so the badge passes AA */

  --hero-bg:      #F0F9FF;   /* sky-50 - the reference hero wash */
  --hero-glow:    rgba(6, 182, 212, .07);

  --header-bg:    rgba(248, 250, 252, .90);
  --shadow-card:  0 1px 2px rgba(15, 23, 42, .05);
  --shadow-photo: 0 10px 34px -14px rgba(15, 23, 42, .45);

  --measure: 1140px;         /* content width of every section */
  --gutter: clamp(1.1rem, 4vw, 2rem);
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;

}

/* ===========================================================================
   2. BASE
   =========================================================================== */
*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: 5rem;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 12% 14%, rgba(15, 118, 110, .12), transparent 28%),
    radial-gradient(circle at 88% 0%, rgba(37, 99, 235, .10), transparent 25%),
    radial-gradient(circle at 85% 86%, rgba(15, 118, 110, .08), transparent 20%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-wrap: break-word;
  position: relative;
  isolation: isolate;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background: none;
}

h1, h2, h3, h4 {
  font-family: var(--font-sans);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: normal;
  margin: 0;
  text-wrap: balance;
}

p { margin: 0 0 1em; }
p:last-child { margin-bottom: 0; }
ul, ol { margin: 0; padding: 0; }
li { list-style: none; }
img, svg { max-width: 100%; }
img { height: auto; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; }

a {
  color: var(--accent);
  text-decoration: none;
  transition: color var(--speed) ease, opacity var(--speed) ease;
}
a:hover { color: var(--accent-hover); }

:where(a, button, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}

.wrap {
  width: 100%;
  max-width: var(--measure);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%);
  white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: .5rem; top: -4rem; z-index: 200;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--rule-strong); border-radius: var(--r-sm);
  padding: .6rem 1rem; transition: top var(--speed) ease;
}
.skip-link:focus { top: .5rem; }

/* Unfilled placeholder values — visible, but clearly provisional. */
.todo { color: var(--ink-3); font-style: italic; }

/* ===========================================================================
   3. HEADER / NAV
   =========================================================================== */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--header-bg);
  -webkit-backdrop-filter: saturate(1.5) blur(16px);
  backdrop-filter: saturate(1.5) blur(16px);
  border-bottom: 1px solid var(--rule);
  transition: box-shadow var(--speed) ease, background var(--speed) ease;
}
.site-header.is-stuck { box-shadow: var(--shadow-head); }

.site-header__inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; min-height: 3.75rem;
}

.brand {
  font-family: var(--font-sans);
  font-size: 1.25rem; font-weight: 700; letter-spacing: -.025em;
  background: linear-gradient(90deg, var(--grad-1), var(--grad-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand:hover { filter: brightness(1.15); transform: translateY(-1px); }

.nav { display: flex; gap: 2rem; }
.nav a {
  position: relative;
  font-size: .875rem; font-weight: 500; letter-spacing: .01em;
  color: var(--ink-2); padding-block: .3rem;
  transition: color var(--speed) ease, transform var(--speed) ease;
}
.nav a::after {
  content: ""; position: absolute; left: 0; bottom: 0;
  height: 2px; width: 0; border-radius: 2px;
  background: linear-gradient(90deg, var(--grad-1), var(--grad-2));
  transition: width var(--speed) ease;
}
.nav a:hover { color: var(--ink); }
.nav a:hover::after { width: 100%; }
.nav a[aria-current="true"] { color: var(--accent); }
.nav a[aria-current="true"]::after { width: 100%; }

.header-tools { display: flex; align-items: center; gap: .4rem; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2.3rem; height: 2.3rem; border-radius: var(--r-md);
  color: var(--ink-2); cursor: pointer;
  border: 1px solid transparent;
  transition: color var(--speed) ease, background var(--speed) ease, border-color var(--speed) ease, transform var(--speed) ease, box-shadow var(--speed) ease;
}
.icon-btn:hover { color: var(--accent); background: var(--accent-soft); border-color: var(--rule); transform: translateY(-1px); box-shadow: var(--shadow-card); }
.icon-btn .ico { width: 18px; height: 18px; }

.menu-btn { display: none; }

:root[data-theme="dark"] .ico-sun, :root:not([data-theme="light"]) .ico-sun { display: none; }
.ico-moon { display: none; }
:root[data-theme="dark"] .ico-moon { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .ico-moon { display: block; }
  :root[data-theme="light"] .ico-sun { display: block; }
  :root[data-theme="light"] .ico-moon { display: none; }
}

/* Mobile drawer */
.mobile-nav {
  border-top: 1px solid var(--rule);
  background: var(--bg);
}
.mobile-nav ul { padding-block: .4rem; }
.mobile-nav a {
  display: block; padding: .72rem var(--gutter);
  font-size: .95rem; font-weight: 500; color: var(--ink-2);
  border-bottom: 1px solid var(--rule);
}
.mobile-nav li:last-child a { border-bottom: 0; }
.mobile-nav a:hover, .mobile-nav a[aria-current="true"] { color: var(--accent); background: var(--accent-soft); }

/* ===========================================================================
   4. SECTION SHELL
   =========================================================================== */
.section {
  position: relative;
  padding-block: clamp(3rem, 7vw, 4.8rem);
  background: linear-gradient(180deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, 0)) , var(--bg);
}
.section--alt {
  background:
    radial-gradient(circle at 100% 0%, rgba(15, 118, 110, .05), transparent 24%),
    var(--bg-alt);
}

.section-title {
  position: relative; display: inline-block;
  font-size: clamp(1.5rem, 4vw, 1.875rem);   /* text-3xl */
  font-weight: 700; letter-spacing: normal;
  color: var(--ink);
  margin-bottom: 2.2rem;
  padding-bottom: .5rem;
}
.section-title::after {
  content: ""; position: absolute; left: 0; bottom: 0;
  width: 100%; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, var(--grad-1), var(--grad-2));
}
.section-lede {
  margin-top: -1.55rem; margin-bottom: 2.1rem;
  color: var(--ink-3); font-size: .93rem; max-width: 64ch;
}

.card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  transition: transform var(--speed) ease, box-shadow var(--speed) ease, border-color var(--speed) ease, background var(--speed) ease;
}

/* ===========================================================================
   5. HERO
   =========================================================================== */
.hero {
  padding-block: clamp(3rem, 8vw, 5rem) clamp(2.5rem, 6vw, 3.5rem);
  background:
    radial-gradient(ellipse 70% 70% at 15% 50%, var(--hero-glow) 0%, transparent 60%),
    var(--hero-bg);
  border-bottom: 1px solid var(--rule);
  overflow: hidden;
}

.hero__top {
  display: grid;
  /* Both tracks are fr units, which are DEFINITE. They must not be `auto`:
     the carousel slides are position:absolute, so an auto track measures their
     max-content width as 0 and collapses. Fractions also let the photo scale
     with the row instead of being pinned to a fixed cap. */
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.06fr);
  gap: clamp(1.75rem, 3.5vw, 3rem);
  /* The portrait keeps its own square shape rather than being stretched to the
     text height — squeezing it to match would crop the head off. Centred, so
     the extra height it carries is shared above and below the text. */
  align-items: center;
}

.hero__visual {
  width: 100%;
  justify-self: stretch;
}

.hero__visual--carousel {
  border-radius: 16px;
  box-shadow: var(--shadow-photo);
}

.hero__visual--carousel .carousel {
  border: 0;
  border-radius: 16px;
  box-shadow: none;
}

.hero__visual--portrait {
  display: flex;
  justify-content: flex-end;   /* flush with the right edge of the row */
}

.hero h1 {
  font-size: clamp(2.5rem, 8vw, 3.75rem);    /* text-5xl -> md:text-6xl */
  font-weight: 700;                          /* font-bold */
  line-height: 1.25;                         /* leading-tight */
  letter-spacing: normal;
  color: var(--ink);                         /* slate-900 */
  margin-bottom: .5rem;                      /* mb-2 */
}
.hero h1 .accent {
  background: linear-gradient(90deg, var(--grad-1), var(--grad-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero__role {
  /* Sized to stay on one line at desktop widths. It still wraps on a narrow
     phone, which is correct — forcing nowrap there would push the line off
     the side of the screen. */
  font-size: clamp(.8125rem, 1.15vw, .9375rem);
  font-weight: 400; line-height: 1.5;
  letter-spacing: .005em;
  color: var(--ink-strong);
  margin-bottom: 1.25rem;
}
.hero__bio { font-size: 1rem; color: var(--ink-2); line-height: 1.625; max-width: 58ch; }
.hero__bio a { font-weight: 400; color: var(--accent); }
.hero__bio a:hover { text-decoration: underline; text-underline-offset: .15em; }

.portrait-ring {
  /* No border and no coloured ring — the portrait carries the same soft shadow
     the photo carousel uses, so nothing on this page is framed in a line.

     Square, matching the file tools/build_media.py writes (the original photo
     trimmed just below the pockets). Same shape in, same shape out, so nothing
     is cropped a second time by the browser. */
  position: relative;
  width: 100%;
  max-width: 23rem;
  aspect-ratio: 1 / 1;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow-photo);
  background: var(--surface-alt);
}
.portrait {
  position: absolute; inset: 0;
  display: block;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 30%;   /* only bites if a replacement is not square */
}
@media (max-width: 860px) {
  .hero__visual--portrait { justify-content: center; }
  .portrait-ring { max-width: 20rem; }
}

/* The link buttons stretch to fill the row rather than trailing off with
   empty space on the right. `flex: 1 1 8.5rem` gives every button the same
   basis and an equal share of whatever is left over, so they end up equal
   width on one line and still wrap tidily on a narrow screen. */
.hero__actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2.5rem; }
/* `flex: 1 1 auto` — basis is each button's own content width, so a long
   label like "Google Scholar" is never squeezed onto two lines and every
   button stays one line tall. They still share the leftover space equally and
   fill the row. */
.hero__actions .btn { flex: 1 1 auto; justify-content: center; white-space: nowrap; }

.btn {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .5rem 1rem;
  font-size: .875rem; font-weight: 500;      /* text-sm font-medium */
  border-radius: .5rem;                      /* rounded-lg */
  border: 1px solid transparent;
  cursor: pointer;
  transition: background var(--speed) ease, color var(--speed) ease,
              border-color var(--speed) ease, transform var(--speed) ease,
              box-shadow var(--speed) ease, filter var(--speed) ease;
}
.btn .ico { width: 15px; height: 15px; flex: none; }
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }

.btn--primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-card); }
.btn--primary:hover { background: var(--accent-hover); color: var(--on-accent); filter: saturate(1.04); }

.btn--outline {
  background: var(--surface); color: var(--accent);
  border-color: var(--accent);
}

/* ---- brand-coloured link buttons ----------------------------------------
   Each service's own colour, adjusted where the official hex cannot carry
   legible label text:
     Gmail   #EA4335 -> #C5221F   (white on official = 3.9:1, fails)
     Scholar #4285F4 -> #1967D2   (3.6:1, fails)
     Kaggle  #20BEFF -> #067AB8   (2.1:1, fails)
     ORCID   #A6CE39 kept, but with dark text (white on it = 1.8:1)
     GitHub  #24292F kept in light; lightened in dark or it vanishes.
   Every pairing below is at least 4.6:1. */
[data-brand] { --b-bg: var(--accent); --b-fg: #FFFFFF; }
[data-brand="gmail"]    { --b-bg: #C5221F; --b-fg: #FFFFFF; }
[data-brand="scholar"]  { --b-bg: #1967D2; --b-fg: #FFFFFF; }
[data-brand="github"]   { --b-bg: #24292F; --b-fg: #FFFFFF; }
[data-brand="linkedin"] { --b-bg: #0A66C2; --b-fg: #FFFFFF; }
[data-brand="orcid"]    { --b-bg: #A6CE39; --b-fg: #14202B; --b-ico: #6E8A23; }
[data-brand="kaggle"]   { --b-bg: #067AB8; --b-fg: #FFFFFF; }
/* The CV button uses the site's own accent rather than a service colour, so
   it reads as this page's action and not as another external profile. */
[data-brand="cv"]       { --b-bg: var(--accent); --b-fg: var(--on-accent); }

/* Contact me picks up the colour the name gradient ends on — the indigo at the
   tail of "Kumar". Not literally --grad-2 (#6366F1): white on that measures
   4.47:1, a hair under AA for a 14px label. #6062F0 is three shades darker,
   indistinguishable side by side, and clears it at 4.66:1. */
[data-brand="contact"]  { --b-bg: #6062F0; --b-fg: #FFFFFF; }
:root[data-theme="dark"] [data-brand="contact"] { --b-bg: #818CF8; --b-fg: #0B1220; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [data-brand="contact"] { --b-bg: #818CF8; --b-fg: #0B1220; }
}

:root[data-theme="dark"] [data-brand="github"] { --b-bg: #3A424C; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [data-brand="github"] { --b-bg: #3A424C; }
}

/* The profile buttons are white cards: only the icon carries the brand
   colour, and the label stays in page ink. Six saturated fills in a row read
   as a toolbar; this reads as a page. Download CV is the exception below —
   it is the one action here, so it stays solid. */
.btn--brand {
  background: var(--surface);
  border-color: var(--rule);
  color: var(--ink);
  box-shadow: var(--shadow-card);
}
.btn--brand svg { color: var(--b-ico, var(--b-bg)); }
.btn--brand:hover {
  color: var(--ink);
  background: var(--surface);
  border-color: var(--b-ico, var(--b-bg));
  filter: none;
}

.btn--brand[data-brand="cv"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}
.btn--brand[data-brand="cv"] svg { color: var(--on-accent); }
.btn--brand[data-brand="cv"]:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  color: var(--on-accent);
}

/* On the dark surface the brand hexes are too dark to see — GitHub's is
   literally 1:1 against it — so each gets a lightened icon there. All six
   clear 3:1 on #1E293B. */
:root[data-theme="dark"] {
  --ico-contact:  #9AA3FA;
  --ico-scholar:  #7AAEF8;
  --ico-github:   #C9D1D9;
  --ico-linkedin: #61A8EC;
  --ico-orcid:    #B7DC4F;
  --ico-kaggle:   #4FC3F7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ico-contact:  #9AA3FA;
    --ico-scholar:  #7AAEF8;
    --ico-github:   #C9D1D9;
    --ico-linkedin: #61A8EC;
    --ico-orcid:    #B7DC4F;
    --ico-kaggle:   #4FC3F7;
  }
}
.btn--brand[data-brand="contact"]  svg { color: var(--ico-contact,  #6062F0); }
.btn--brand[data-brand="scholar"]  svg { color: var(--ico-scholar,  #1967D2); }
.btn--brand[data-brand="github"]   svg { color: var(--ico-github,   #24292F); }
.btn--brand[data-brand="linkedin"] svg { color: var(--ico-linkedin, #0A66C2); }
.btn--brand[data-brand="orcid"]    svg { color: var(--ico-orcid,    #6E8A23); }
.btn--brand[data-brand="kaggle"]   svg { color: var(--ico-kaggle,   #067AB8); }
.social-btn--brand {
  background: var(--b-bg);
  border-color: var(--b-bg);
  color: var(--b-fg);
}
.social-btn--brand:hover {
  background: var(--b-bg);
  border-color: var(--b-bg);
  color: var(--b-fg);
  filter: brightness(1.12);
}
.btn--outline:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

.hero__interests { margin-top: 2rem; }
.eyebrow {
  font-size: .8125rem; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink);
  margin-bottom: 1.1rem;
}
/* Research-interest cards. No card border: thin vertical rules between
   columns instead, which keeps a row of eight from reading as eight boxes. */
.icards {
  /* auto-flow column forces a single row whatever the item count, and equal
     columns keep the rules evenly spaced. */
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 0;
  margin-top: .25rem;
}
.icard {
  padding: 1.25rem 1.15rem 1.35rem;
  border-left: 1px solid var(--rule);
  text-align: center;
  transition: background var(--speed) ease;
}
.icard:first-child { border-left: 0; }
.icard:hover { background: var(--surface); }
.icard__badge {
  display: flex; align-items: center; justify-content: center;
  width: 3.5rem; height: 3.5rem; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  /* Centred over the column, with the title left-aligned beneath it. */
  margin: 0 auto 1rem;
}
.icard__badge svg { width: 26px; height: 26px; stroke-width: 1.6; }
.icard__title {
  font-size: .9375rem; font-weight: 700; line-height: 1.4;
  color: var(--ink); margin-bottom: 0;
  text-wrap: balance;
}
.icard__desc { font-size: .8125rem; color: var(--ink-3); line-height: 1.5; margin-top: .35rem; }

.pills { display: flex; flex-wrap: wrap; gap: .45rem; }
.pill {
  padding: .375rem .75rem;
  font-size: .875rem; color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 999px;
  transition: transform var(--speed) ease, border-color var(--speed) ease, background var(--speed) ease, color var(--speed) ease, box-shadow var(--speed) ease;
}
.pill:hover { transform: translateY(-1px); border-color: var(--accent); color: var(--accent); box-shadow: var(--shadow-card); }

/* ===========================================================================
  6. NEWS
  =========================================================================== */
.hero__top--solo { grid-template-columns: minmax(0, 1fr); }
.hero__top--solo .hero__bio,
.hero__top--solo .hero__text { max-width: 74ch; }

/* News and Photos side by side. Each column keeps its own heading. */
.news-grid--solo { grid-template-columns: minmax(0, 1fr) !important; }
.news-col, .photo-col { min-width: 0; }
.photo-frame { border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-photo); }
.photo-frame .carousel { border-radius: 16px; box-shadow: none; }
.photo-frame .carousel__viewport { aspect-ratio: 4 / 3; }

.news-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
  gap: clamp(1.5rem, 3.5vw, 2.75rem);
  align-items: start;
}
.news-grid .section-title { margin-bottom: 1.6rem; }

.scroll-box {
  max-height: 22rem; overflow-y: auto;
  padding-right: .5rem;
  scrollbar-width: thin;
  scrollbar-color: var(--rule-strong) transparent;
  overscroll-behavior: contain;
}
.scroll-box::-webkit-scrollbar { width: 6px; }
.scroll-box::-webkit-scrollbar-thumb { background: var(--rule-strong); border-radius: 3px; }
.scroll-box::-webkit-scrollbar-track { background: transparent; }
.scroll-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

.news-list { display: grid; gap: .6rem; }
.news-card { padding: .85rem 1rem; border-radius: var(--r-md); }
.news-card__date {
  display: inline-block; margin-right: .5rem;
  font-size: .7rem; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--accent);
  white-space: nowrap;
}
.news-card__text { font-size: .885rem; color: var(--ink-2); line-height: 1.6; }
.news-card__text strong { color: var(--ink); font-weight: 600; }
.news-card__text a { font-weight: 500; }
.news-card__text a:hover { text-decoration: underline; text-underline-offset: .15em; }
/* "New" badge — a soft pulse rather than a hard blink. A hard on/off flash is
   both unpleasant and an accessibility problem; an opacity pulse reads as
   "live" without flashing. It stops entirely under prefers-reduced-motion. */
.badge-new {
  display: inline-flex; align-items: center; gap: .3rem;
  margin-left: .45rem; padding: .1rem .45rem .1rem .38rem;
  font-size: .64rem; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--new-ink); background: var(--new-bg);
  border: 1px solid var(--new-line); border-radius: 999px;
  vertical-align: .1em; white-space: nowrap;
  animation: badge-pulse 1.9s ease-in-out infinite;
}
.badge-new__dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--new-line); flex: none;
  animation: dot-pulse 1.9s ease-in-out infinite;
}
@keyframes badge-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(224, 161, 22, 0); }
  50%      { box-shadow: 0 0 0 3px rgba(224, 161, 22, .22); }
}
@keyframes dot-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .45; transform: scale(.72); }
}

/* Update rows: icon column, and a warm left edge on the current year. */
.news-card {
  display: grid; grid-template-columns: 1.85rem minmax(0, 1fr); gap: .75rem;
  align-items: start;
}
.news-card.is-new { border-left: 3px solid var(--new-line); }
.news-card__ico {
  display: flex; align-items: center; justify-content: center;
  width: 1.85rem; height: 1.85rem; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent); flex: none;
  margin-top: .05rem;
}
.news-card.is-new .news-card__ico { background: var(--new-bg); color: var(--new-ink); }
.news-card__ico svg { width: 15px; height: 15px; }

/* Auto-scroll shell: a soft fade at the top and bottom edges so the list
   reads as continuing rather than being cut off. */
.scroll-shell { position: relative; }
.scroll-shell::before, .scroll-shell::after {
  content: ""; position: absolute; left: 0; right: .5rem; height: 2rem;
  pointer-events: none; z-index: 1;
}
.scroll-shell::before { top: 0; background: linear-gradient(to bottom, var(--bg), transparent); }
.scroll-shell::after { bottom: 0; background: linear-gradient(to top, var(--bg), transparent); }
.section--alt .scroll-shell::before { background: linear-gradient(to bottom, var(--bg-alt), transparent); }
.section--alt .scroll-shell::after { background: linear-gradient(to top, var(--bg-alt), transparent); }
.scroll-box--auto { max-height: 24rem; scroll-behavior: auto; }

/* Carousel */
.carousel {
  position: relative; border-radius: var(--r-lg); overflow: hidden;
  box-shadow: var(--shadow-photo);
}
.carousel__viewport { position: relative; aspect-ratio: 16 / 10; background: var(--surface-alt); }
.carousel--hero .carousel__viewport { aspect-ratio: 3 / 2; }
.carousel__slide { position: absolute; inset: 0; opacity: 0; transform: scale(1.02); transition: opacity 420ms ease, transform 520ms ease; }
.carousel__slide.is-active { opacity: 1; transform: scale(1); }
.carousel__slide img,
.carousel__slide video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
.carousel__caption {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 2.4rem 1rem 1.9rem;
  font-size: .875rem; font-weight: 500; text-align: center;
  color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .5);
  background: linear-gradient(to top, rgba(4, 10, 18, .78) 35%, transparent);
}
.carousel__btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 2.4rem; height: 3.1rem; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; background: rgba(15, 23, 42, .52);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  cursor: pointer;
  transition: background var(--speed) ease, transform var(--speed) ease, box-shadow var(--speed) ease;
}
.carousel__btn:hover { background: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,.18); transform: translateY(-50%) scale(1.04); }
.carousel__btn .ico { width: 16px; height: 16px; }
.carousel__btn--prev { left: .55rem; }
.carousel__btn--next { right: .55rem; }
.carousel__dots {
  position: absolute; left: 50%; bottom: .6rem; transform: translateX(-50%);
  display: flex; gap: .4rem;
}
.carousel__dot {
  width: 9px; height: 9px; border-radius: 50%; padding: 0;
  background: rgba(255, 255, 255, .5); cursor: pointer;
  transition: background var(--speed) ease, transform var(--speed) ease;
}
.carousel__dot[aria-current="true"] { background: var(--accent); transform: scale(1.3); }
.carousel__dot:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
/* Slide counter, used in place of the dots once there are more than ten.
   Top-right so it never lands on top of a caption. */
.carousel__count {
  position: absolute; top: .6rem; right: .6rem;
  padding: .2rem .55rem; border-radius: 999px;
  background: rgba(4, 10, 18, .58); color: #fff;
  font-size: .75rem; font-weight: 600; letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}

/* ===========================================================================
   7. RESEARCH THREADS
   =========================================================================== */
.threads { display: grid; gap: 1.1rem; }
.thread { padding: 1.35rem 1.5rem; border-radius: var(--r-lg); border-left: 3px solid var(--accent); }
.thread__eyebrow {
  font-size: .68rem; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--accent); margin-bottom: .35rem;
}
.thread__title { font-size: 1.125rem; font-weight: 600; margin-bottom: .5rem; }
.thread__body { font-size: .925rem; color: var(--ink-2); }
.thread__pubs { margin-top: .8rem; display: grid; gap: .25rem; }
.thread__pubs li { font-size: .84rem; color: var(--ink-3); padding-left: 1rem; position: relative; }
.thread__pubs li::before {
  content: ""; position: absolute; left: 0; top: .62em;
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
}

/* ===========================================================================
   7b. RESEARCH PROJECTS
   =========================================================================== */
/* One card per row, full width. Two columns left half of a short card blank
   whenever its neighbour ran long, and the numbering only reads in order down
   a single column. */
.proj-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 1rem;
  list-style: none;
  padding: 0; margin: 0;
  counter-reset: none;
}
.proj {
  display: flex; flex-direction: column;
  padding: 1.35rem 1.45rem;
  border-radius: var(--r-lg);
  /* No accent bar down the left edge — the timeline rail beside the card is
     already that line, and two of them read as a mistake. */
  transition: border-color var(--speed) ease, box-shadow var(--speed) ease;
}
.proj:hover { box-shadow: var(--shadow-lift); }
.proj__title {
  font-size: 1.0625rem; font-weight: 700; line-height: 1.35;
  color: var(--ink); margin-bottom: .6rem;
}
/* Where it runs. A muted line, not a pill — the pills below are the subject
   matter, and a status badge among them would read as another topic. */
.proj__status {
  font-size: .78rem; color: var(--ink-3); line-height: 1.5;
  margin: -.35rem 0 .7rem;
}
.proj__tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .75rem; }
.proj__tag {
  font-size: .72rem; font-weight: 600; letter-spacing: .02em;
  color: var(--accent); background: var(--accent-soft);
  border-radius: 999px; padding: .15rem .55rem;
}
.proj__overview {
  font-size: .9rem; color: var(--ink-2); line-height: 1.6; margin-bottom: .85rem;
}
/* What it does in practice, under the overview. Cards without highlights are
   untouched — the list simply is not rendered. */
.proj__highlights {
  margin: 0 0 .9rem; padding: 0; list-style: none;
  display: grid; gap: .4rem;
}
.proj__highlights li {
  position: relative; padding-left: 1rem;
  font-size: .84rem; line-height: 1.55; color: var(--ink-2);
}
.proj__highlights li::before {
  content: ""; position: absolute; left: .1rem; top: .58em;
  width: .3rem; height: .3rem; border-radius: 50%;
  background: var(--accent);
}

/* Models & tools: a labelled list of name \u2013 role lines. */
.proj__models { margin: 0 0 .95rem; }
.proj__models-label {
  margin: 0 0 .4rem;
  font-size: .72rem; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3);
}
.proj__models ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .25rem; }
.proj__models li {
  font-size: .82rem; line-height: 1.55; color: var(--ink-3);
}
.proj__models li b { font-weight: 600; color: var(--ink-2); }

/* Several clips: their toggles sit on one row and wrap. */
.proj__clips { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin-bottom: .95rem; }
.proj__clips .proj__demo-block { margin-bottom: 0; flex: 1 1 100%; }
.proj__clips .proj__demo-block:has(.proj__demo-wrap[hidden]) { flex: 0 0 auto; }

.proj__links { margin: 0 0 .9rem; }
.proj__repo {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .35rem .8rem;
  font-size: .82rem; font-weight: 600;
  color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 999px;
  transition: color var(--speed) ease, border-color var(--speed) ease;
}
.proj__repo:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }
.proj__repo .ico { width: 14px; height: 14px; flex: none; }

/* The demo is behind a toggle: nothing is fetched, and no player appears,
   until someone asks for it. */
.proj__demo-block { margin-bottom: .95rem; }
.proj__demo-btn {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .35rem .8rem .35rem .6rem;
  font-size: .82rem; font-weight: 600;
  color: var(--ink-3); background: transparent;
  border: 1px dashed var(--rule-strong); border-radius: 999px;
  cursor: pointer;
  transition: color var(--speed) ease, border-color var(--speed) ease,
              background var(--speed) ease;
}
.proj__demo-btn:hover {
  color: var(--accent); border-color: var(--accent); background: var(--accent-soft);
}
.proj__demo-btn .chev {
  width: 12px; height: 12px;
  transition: transform var(--speed) ease;
}
.proj__demo-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }

.proj__demo-wrap { margin-top: .75rem; }
.proj__demo {
  display: block; width: 100%; max-width: 40rem;
  aspect-ratio: 16 / 9;
  border-radius: var(--r-md);
  background: #000;
  /* `contain`, not `cover`: a screen recording is not always 16:9, and
     cropping the sides off a dashboard loses the part worth seeing. The
     frame keeps its shape so nothing jumps when the clip loads. */
  object-fit: contain;
}

.proj__tech {
  display: flex; flex-wrap: wrap; gap: .3rem .55rem;
  margin-top: auto; padding-top: .75rem;
  border-top: 1px solid var(--rule);
}
.proj__tech li {
  font-size: .76rem; color: var(--ink-3);
}
.proj__tech li + li::before {
  content: "·"; margin-right: .55rem; color: var(--rule-strong);
}

/* ---- academic services --------------------------------------------------
   Same card as an award, but the emphasis is the journal rather than a prize,
   so there is no gold badge. */
.svc-list { display: grid; gap: .85rem; }
.svc {
  display: grid; grid-template-columns: 3.75rem minmax(0, 1fr); gap: 1.1rem;
  padding: 1.25rem 1.35rem; border-radius: var(--r-lg);
  align-items: start;
}
/* One square box for logos of very different shapes — PLOS is a wide
   wordmark, the JAI mark is square — so `contain` on a white ground keeps
   both readable without cropping either. */
.svc__mark {
  display: flex; align-items: center; justify-content: center;
  width: 3.75rem; height: 3.75rem; flex: none;
  padding: .4rem; border-radius: 12px;
  background: #FFFFFF; border: 1px solid var(--rule);
}
.svc__logo { width: 100%; height: 100%; object-fit: contain; display: block; }
.svc__head {
  display: flex; flex-wrap: wrap; align-items: baseline;
  justify-content: space-between; gap: .2rem 1rem;
}
.svc__org { font-size: 1.0625rem; font-weight: 700; line-height: 1.35; color: var(--ink); }
.svc__org a { color: inherit; }
.svc__org a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .16em; }
.svc__date {
  font-size: .8125rem; font-weight: 600; color: var(--accent);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.svc__role { font-size: .9rem; font-weight: 500; color: var(--ink-2); margin: .15rem 0 0; }
.svc__ms { font-size: .875rem; color: var(--ink-2); line-height: 1.6; margin: .55rem 0 0; }
.svc__ms-label { font-weight: 600; color: var(--ink-3); }
.svc__note { font-size: .875rem; color: var(--ink-3); line-height: 1.65; margin: .4rem 0 0; }
.svc__link { margin: .7rem 0 0; }
.svc__link a {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .82rem; font-weight: 600; color: var(--accent);
}
.svc__link a:hover { text-decoration: underline; text-underline-offset: .15em; }
.svc__link .ico { width: 14px; height: 14px; flex: none; }
@media (max-width: 560px) {
  .svc { grid-template-columns: 3rem minmax(0, 1fr); gap: .8rem; padding: 1.1rem 1.15rem; }
  .svc__mark { width: 3rem; height: 3rem; }
}

/* ===========================================================================
   8. PUBLICATIONS
   =========================================================================== */
.pubs-bar {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: .75rem 1rem;
  margin-bottom: 1.4rem;
}
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  padding: .35rem .85rem; font-size: .82rem; font-weight: 500;
  color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 999px;
  cursor: pointer;
  transition: color var(--speed) ease, background var(--speed) ease, border-color var(--speed) ease;
}
.chip:hover { color: var(--accent); border-color: var(--accent); }
.chip[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.chip__n { opacity: .65; margin-left: .3rem; font-variant-numeric: tabular-nums; }

/* Jump chips: the same pill, but a link rather than a filter button, so the
   count leads and there is no pressed state. */
.chip--jump {
  display: inline-flex; align-items: baseline; gap: .38rem;
  text-decoration: none;
}
.chip--jump .chip__n {
  margin-left: 0; opacity: 1;
  font-weight: 700; color: var(--accent);
}
.chip--jump:hover { color: var(--accent); border-color: var(--accent); }
.chip--jump:hover .chip__n { color: var(--accent); }

/* The jump targets sit under a sticky header. */
.pub-group, .pub-subhead, .proj-group { scroll-margin-top: 5.5rem; }
.proj-group + .proj-group { margin-top: 2.4rem; }

/* Reveals the rest of a section. Full width so it reads as the bottom edge of
   the list rather than as another link floating beside the cards. */
.pub-more {
  display: flex; align-items: center; justify-content: center; gap: .4rem;
  width: 100%; margin-top: .75rem; padding: .6rem 1rem;
  font-size: .85rem; font-weight: 600;
  color: var(--ink-3); background: transparent;
  border: 1px dashed var(--rule-strong); border-radius: var(--r-md);
  cursor: pointer;
  transition: color var(--speed) ease, border-color var(--speed) ease,
              background var(--speed) ease;
}
.pub-more:hover {
  color: var(--accent); border-color: var(--accent);
  background: var(--accent-soft);
}
.pub-more .chev {
  width: 12px; height: 12px;
  transform: rotate(90deg);
  transition: transform var(--speed) ease;
}
.pub-more[aria-expanded="true"] .chev { transform: rotate(-90deg); }

.pub-group { margin-bottom: 1.9rem; }
.pub-group:last-child { margin-bottom: 0; }
.group-head {
  display: flex; align-items: center; gap: .85rem;
  margin-bottom: 1.1rem;
}
.group-head__title {
  font-size: 1.25rem; font-weight: 700; color: var(--ink);
  white-space: nowrap;
}
.group-head::after {
  content: ""; flex: 1 1 auto; height: 1px; background: var(--rule);
}

@media (max-width: 520px) {
  .group-head__title { white-space: normal; }
}

.pub-list { display: grid; gap: .85rem; }

.pub {
  background: var(--surface-alt);
  display: grid;
  grid-template-columns: 5.5rem minmax(0, 1fr);
  gap: 1.1rem;
  padding: 1.15rem;
  border-radius: var(--r-lg);
  transition: border-color var(--speed) ease, box-shadow var(--speed) ease, transform var(--speed) ease;
}
.pub:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); transform: translateY(-3px); }

.pub__thumb {
  width: 5.5rem; height: 5.5rem;
  object-fit: cover; border-radius: var(--r-md);
  background: var(--surface-alt);
  border: 1px solid var(--rule);
  cursor: zoom-in;
  transition: transform var(--speed) ease, box-shadow var(--speed) ease, border-color var(--speed) ease;
}
.pub__thumb:hover { transform: scale(1.04); box-shadow: var(--shadow-card); border-color: var(--accent); }

/* No figure: the text takes the whole card rather than leaving a blank
   column where an image would have been. */
.pub--no-figure { grid-template-columns: minmax(0, 1fr); }

/* Plain: no panel and no border, so the entry sits on the page the way the
   Under Review sentence does. */
.pub--plain {
  background: transparent;
  border: 0;
  box-shadow: none;
  padding: 0;
}

.pub__head {
  display: flex; flex-wrap: wrap; align-items: baseline;
  justify-content: space-between; gap: .2rem .9rem;
  margin-bottom: .35rem;
}
.pub__title { font-size: 1rem; font-weight: 600; line-height: 1.4; letter-spacing: -.01em; flex: 1 1 18rem; }
.pub__title a { color: var(--ink); }
.pub__title a:hover { color: var(--accent); }
.pub__venue { font-size: .8rem; font-weight: 600; color: var(--accent); white-space: nowrap; }
.pub__venue--review {
  padding: .1rem .5rem; border-radius: 999px;
  background: var(--accent-soft); border: 1px solid var(--accent);
  font-size: .72rem; letter-spacing: .04em; text-transform: uppercase;
}
.pub__authors { font-size: .855rem; color: var(--ink-2); margin-bottom: .5rem; }
.pub__authors .me { font-weight: 700; color: var(--ink); }

.pub__links { display: flex; flex-wrap: wrap; gap: .9rem; }
.pub__links a { display: inline-flex; align-items: center; gap: .32rem; font-size: .82rem; font-weight: 500; }
.pub__links a:hover { text-decoration: underline; text-underline-offset: .15em; }
.pub__links .ico { width: 13px; height: 13px; flex: none; }

/* The award link opens a certificate, not another copy of the paper, so it
   reads as a small badge rather than as a third file link. */
.pub__links a[data-link="award"] {
  padding: .1rem .5rem .1rem .4rem;
  border-radius: 999px;
  color: var(--new-ink);
  background: var(--new-bg);
  border: 1px solid var(--new-line);
  font-weight: 600;
}
.pub__links a[data-link="award"]:hover { text-decoration: none; filter: brightness(.97); }

.pub__title-alt {
  margin: .25rem 0 0;
  font-size: .9rem; font-weight: 500; line-height: 1.55;
  color: var(--ink-3);
  word-break: keep-all;   /* Korean wraps on phrase, not mid-word */
}
.pub__patno {
  font-size: .8125rem; color: var(--ink-3); margin: .3rem 0 0;
  font-variant-numeric: tabular-nums;
}
.pub__tldr { margin-top: .55rem; font-size: .82rem; font-style: italic; color: var(--ink-3); line-height: 1.6; }
.pub__tldr b { font-style: normal; font-weight: 600; color: var(--ink-2); }

.pub__abstract { margin-top: .55rem; }
.pub__abstract summary {
  display: inline-flex; align-items: center; gap: .35rem;
  font-size: .8rem; color: var(--ink-3);
  cursor: pointer; list-style: none;
  transition: color var(--speed) ease;
}
.pub__abstract summary::-webkit-details-marker { display: none; }
.pub__abstract summary .chev { width: 11px; height: 11px; transition: transform var(--speed) ease; }
.pub__abstract[open] summary .chev { transform: rotate(90deg); }
.pub__abstract summary:hover, .pub__abstract[open] summary { color: var(--accent); }
.pub__abstract p {
  margin-top: .6rem; padding-top: .7rem;
  border-top: 1px solid var(--rule);
  font-size: .84rem; line-height: 1.7; color: var(--ink-2);
  text-align: justify; text-wrap: pretty;
  hyphens: auto;
}

.pub-subhead { margin-top: 2.4rem; }
.pub-subhead__note { font-size: .85rem; color: var(--ink-3); margin-bottom: 1rem; max-width: 62ch; }
/* The Under Review section is one sentence rather than a list of cards. */
.pub-note {
  font-size: .95rem; line-height: 1.7; color: var(--ink-2);
  max-width: 72ch; margin-top: .2rem;
}
.empty-note { font-size: .9rem; color: var(--ink-3); padding-block: 1.2rem; }

/* ===========================================================================
   8b. AWARDS + CV
   =========================================================================== */
.grid-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
  gap: .85rem;
}

/* ---- section header: eyebrow + title on the left, a quote on the right ---- */
.section-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 20rem);
  gap: 1.5rem 2.5rem;
  align-items: start;
}
.section-quote {
  font-style: italic; font-size: .9375rem; line-height: 1.6;
  color: var(--ink-2); margin: .4rem 0 2.2rem; text-align: right;
}
.section-quote::after {
  content: ""; display: block; width: 4rem; height: 1px; margin: .9rem 0 0 auto;
  background: var(--rule-strong);
}

/* ---- one group: badge, title, then a rule running to the right edge ---- */
.award-group + .award-group { margin-top: 2.25rem; }
.award-group__head {
  display: flex; align-items: center; gap: .85rem;
  margin-bottom: 1.1rem;
}
.award-group__ico {
  display: flex; align-items: center; justify-content: center;
  width: 2.5rem; height: 2.5rem; border-radius: 50%; flex: none;
  background: var(--new-bg); color: var(--new-ink);
}
.award-group:last-child .award-group__ico { background: var(--accent-soft); color: var(--accent); }
.award-group__ico svg { width: 18px; height: 18px; }
.award-group__title { font-size: 1.25rem; font-weight: 700; color: var(--ink); }
.award-group__head::after {
  content: ""; flex: 1 1 auto; height: 1px; background: var(--rule);
}

.awards-grid { display: grid; gap: .85rem; }
.awards-grid--2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); }
.awards-grid--3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
.awards-grid--1 { grid-template-columns: minmax(0, 1fr); }

/* ---- a card ---- */
.award {
  display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); gap: .85rem;
  padding: 1.15rem 1.25rem; border-radius: var(--r-lg);
  align-items: start;
  background: var(--surface);
  border: 1px solid var(--rule);
  box-shadow: var(--shadow-card);
  transition: border-color var(--speed) ease, box-shadow var(--speed) ease;
}
.award:hover { border-color: var(--rule-strong); box-shadow: var(--shadow-md, var(--shadow-card)); }
.award__ico {
  display: flex; align-items: center; justify-content: center;
  width: 2.25rem; height: 2.25rem; border-radius: 50%; flex: none;
  background: var(--new-bg); color: var(--new-ink);
}
.award--fund .award__ico { background: var(--accent-soft); color: var(--accent); }
/* Service is neither a prize nor a grant, so it gets its own neutral badge
   rather than borrowing the gold of an award. */
.award--service .award__ico { background: var(--accent-soft); color: var(--accent); }
.award__ico svg { width: 17px; height: 17px; }
.award__head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: .5rem 1rem; margin-bottom: .3rem;
}
.award__title { font-size: 1rem; font-weight: 700; line-height: 1.35; color: var(--ink); }
.award__year {
  font-size: .8125rem; font-weight: 600; color: var(--accent);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.award__org { font-size: .875rem; color: var(--ink-2); line-height: 1.5; }
.award__note { font-size: .84rem; color: var(--ink-2); margin-top: .5rem; line-height: 1.5; }
.award__for { color: var(--ink-3); font-weight: 700; }

/* ---- closing band ---- */
.awards-foot {
  display: flex; align-items: center; flex-wrap: wrap; gap: .9rem 1.5rem;
  margin-top: 2.25rem; padding: 1.1rem 1.35rem;
  background: var(--accent-soft);
  border-radius: var(--r-lg);
}
.awards-foot__ico {
  display: flex; align-items: center; justify-content: center;
  width: 2.25rem; height: 2.25rem; flex: none;
  color: var(--accent);
  border-right: 1px solid var(--rule-strong); padding-right: 1.1rem;
  box-sizing: content-box;
}
.awards-foot__ico svg { width: 20px; height: 20px; }
.awards-foot__quote {
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic; font-size: .9375rem; color: var(--ink-2); margin: 0;
  flex: 1 1 18rem;
}
.awards-foot__tags {
  margin: 0; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); margin-left: auto;
}

@media (max-width: 760px) {
  .section-head { grid-template-columns: minmax(0, 1fr); }
  .section-quote { text-align: left; margin-top: -1.4rem; }
  .section-quote::after { margin-left: 0; }
  .awards-foot__tags { margin-left: 0; }
}

.cv__intro { font-size: .95rem; color: var(--ink-2); max-width: 62ch; margin-bottom: 1.25rem; }
.cv__actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 1.75rem; }
.cv__pending { font-size: .875rem; margin: 0; }

.cv__facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 21rem), 1fr));
  gap: 0;
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--surface);
}
.cv__facts > div {
  display: grid; grid-template-columns: 9rem minmax(0, 1fr);
  gap: 1rem; padding: .85rem 1.1rem;
  border-bottom: 1px solid var(--rule);
}
.cv__facts dt { font-size: .8rem; color: var(--ink-3); font-weight: 500; }
.cv__facts dd { margin: 0; font-size: .9rem; color: var(--ink-2); }

@media (max-width: 560px) {
  .cv__facts > div { grid-template-columns: minmax(0, 1fr); gap: .1rem; }
  .award__head { flex-direction: column; align-items: flex-start; gap: .1rem; }
}

/* ===========================================================================
   9. TIMELINE (EXPERIENCE) + EDUCATION
   =========================================================================== */
.timeline { position: relative; padding-left: 1.85rem; display: grid; gap: 1rem; }
.timeline::before {
  content: ""; position: absolute; left: 5px; top: .4rem; bottom: .4rem;
  width: 2px; border-radius: 2px;
  background: linear-gradient(to bottom, var(--accent), transparent);
}
.timeline > li { position: relative; }
.timeline > li::before {
  content: ""; position: absolute; left: -1.85rem; top: 1.45rem;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--bg);
}
.section--alt .timeline > li::before { box-shadow: 0 0 0 4px var(--bg-alt); }

.entry { padding: 1.3rem 1.4rem; border-radius: var(--r-lg); }
.entry:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
.entry__head {
  display: flex; flex-wrap: wrap; align-items: baseline;
  justify-content: space-between; gap: .2rem .9rem;
  margin-bottom: .45rem;
}
.entry__role { font-size: 1.0625rem; font-weight: 600; flex: 1 1 14rem; }
.entry__role a { color: inherit; text-decoration: none; }
.entry__role a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .15em; }
.entry__dates {
  font-size: .8rem; font-weight: 600; color: var(--accent);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.entry__org { display: flex; align-items: center; gap: .55rem; margin-bottom: .55rem; }
.entry__logo {
  width: 1.85rem; height: 1.85rem; flex: none;
  object-fit: contain; border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--rule); padding: 2px;
}
.entry__orgname { font-size: .875rem; color: var(--ink-2); font-weight: 500; }
.entry__orglink { color: inherit; }
.entry__orglink:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .16em; }
.entry__orgname .place { color: var(--ink-3); font-weight: 400; }
.entry__desc { font-size: .885rem; color: var(--ink-2); line-height: 1.65; }
.entry__sub { font-size: .855rem; color: var(--ink-3); margin-bottom: .5rem; }
.entry__link {
  display: inline-flex; align-items: center; gap: .35rem;
  margin-top: .7rem; font-size: .82rem; font-weight: 500;
}
.entry__link:hover { text-decoration: underline; text-underline-offset: .15em; }
.entry__link .ico { width: 13px; height: 13px; }

.edu-list { display: grid; gap: 1rem; }

/* ---- education card ------------------------------------------------------
   Logo badge on the left, identity and date pill across the top, then the
   labelled detail rows below a hairline. */
.edu-card {
  display: grid; grid-template-columns: 4.5rem minmax(0, 1fr);
  gap: 1.35rem;
  padding: 1.5rem 1.6rem;
  border-radius: var(--r-lg);
  align-items: start;
}
.edu-card__logo {
  width: 4.5rem; height: 4.5rem;
  object-fit: contain;
}
.edu-card__body { min-width: 0; }

.edu-card__head {
  display: flex; flex-wrap: wrap; align-items: flex-start;
  justify-content: space-between; gap: .6rem 1.25rem;
}
.edu-card__name { font-size: 1.1875rem; font-weight: 700; color: var(--ink); }
.edu-card__degree { font-size: 1rem; font-weight: 500; color: var(--ink-2); margin: .15rem 0 0; }
.edu-card__place {
  display: flex; align-items: center; gap: .35rem;
  font-size: .875rem; color: var(--accent); margin: .5rem 0 0;
}
.edu-card__place svg { width: 14px; height: 14px; flex: none; }

.edu-card__dates {
  font-size: .8125rem; font-weight: 600; color: var(--accent);
  white-space: nowrap; font-variant-numeric: tabular-nums;
  padding-top: .3rem;
}

.edu-details {
  display: grid; gap: .7rem;
  margin-top: 1.1rem; padding-top: 1.1rem;
  border-top: 1px solid var(--rule);
}
.edu-details li {
  display: grid;
  grid-template-columns: 1.85rem 9.5rem minmax(0, 1fr);
  gap: .75rem; align-items: start;
}
.edu-details__ico {
  display: flex; align-items: center; justify-content: flex-start;
  width: 1.85rem; height: 1.85rem; flex: none;
  color: var(--accent);
  padding-top: .15rem;
}
.edu-details__ico svg { width: 16px; height: 16px; }
.edu-details__label {
  font-size: .875rem; font-weight: 700; color: var(--accent);
  padding-top: .2rem;
}
.edu-details__text {
  font-size: .9rem; color: var(--ink-2); line-height: 1.6;
  padding-top: .2rem; padding-left: .9rem;
  border-left: 1px solid var(--rule);
}

@media (max-width: 720px) {
  .edu-card { grid-template-columns: 3.25rem minmax(0, 1fr); gap: 1rem; padding: 1.25rem; }
  .edu-card__logo { width: 3.25rem; height: 3.25rem; }
  .edu-details li { grid-template-columns: 1.85rem minmax(0, 1fr); gap: .5rem .7rem; }
  .edu-details__label { grid-column: 2; padding-top: 0; }
  .edu-details__text {
    grid-column: 2; padding-left: 0; border-left: 0; padding-top: .1rem;
  }
}

/* ===========================================================================
   10. CONTACT + FOOTER
   =========================================================================== */
.section--contact {
  position: relative;
  overflow: hidden;
  background: linear-gradient(160deg, var(--contact-1) 0%, var(--contact-2) 100%);
  border-top: 1px solid var(--rule);
}

/* The Jeju coastline sits on the right and is masked so it dissolves into the
   gradient rather than ending on a hard edge. Decorative only — it carries no
   information, so it has no <img> and no alt text. */
.section--contact::after {
  content: "";
  position: absolute; inset: 0 0 0 auto;
  width: min(46%, 48rem);
  background: url("assets/jeju-contact-bg.jpg") center right / cover no-repeat;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 55%);
  mask-image: linear-gradient(to right, transparent 0%, #000 55%);
  opacity: .9;
  pointer-events: none;
}
:root[data-theme="dark"] .section--contact::after { opacity: .3; filter: brightness(.6) saturate(.85); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .section--contact::after { opacity: .3; filter: brightness(.6) saturate(.85); }
}

/* Keep the content above the photograph. */
.contact-layout { position: relative; z-index: 1; }

.contact-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, .8fr);
  gap: clamp(1.75rem, 4vw, 3.5rem);
  align-items: start;
}

/* ---- left column ---- */
.contact-eyebrow {
  display: flex; align-items: center; gap: .9rem;
  font-size: .78rem; font-weight: 700; letter-spacing: .18em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: .9rem;
}
.contact-eyebrow::after {
  content: ""; flex: 0 0 3rem; height: 1px; background: var(--accent); opacity: .5;
}
.contact-h2 {
  font-size: clamp(1.9rem, 4.2vw, 2.6rem);
  font-weight: 800; letter-spacing: -.025em; line-height: 1.1;
  color: var(--ink); margin-bottom: .85rem;
}
.contact-h2 .accent {
  background: linear-gradient(90deg, var(--grad-1), var(--grad-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.contact-lede { font-size: 1.0625rem; color: var(--ink-2); margin-bottom: .9rem; max-width: 42ch; }
.contact-note { font-size: .9375rem; color: var(--ink-3); line-height: 1.65; max-width: 44ch; }
.contact-sub { font-size: .95rem; font-weight: 700; color: var(--ink); margin: 1.6rem 0 .9rem; }

/* One row, whatever the count. auto-flow column with equal auto-columns lets
   the six tiles share the column width instead of wrapping to a second line. */
.social-grid {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: .55rem;
  align-items: start;
}
.social-grid a {
  display: flex; flex-direction: column; align-items: center; gap: .4rem;
  text-decoration: none;
}
.social-grid a[data-brand="gmail"]    .social-grid__chip { color: var(--ico-contact,  #C5221F); }
.social-grid a[data-brand="scholar"]  .social-grid__chip { color: var(--ico-scholar,  #1967D2); }
.social-grid a[data-brand="github"]   .social-grid__chip { color: var(--ico-github,   #24292F); }
.social-grid a[data-brand="linkedin"] .social-grid__chip { color: var(--ico-linkedin, #0A66C2); }
.social-grid a[data-brand="orcid"]    .social-grid__chip { color: var(--ico-orcid,    #6E8A23); }
.social-grid a[data-brand="kaggle"]   .social-grid__chip { color: var(--ico-kaggle,   #067AB8); }

.social-grid__chip {
  width: 100%; max-width: 2.9rem; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px;
  background: var(--surface); border: 1px solid var(--rule);
  color: var(--b-ico, var(--b-bg));
  box-shadow: var(--shadow-card);
  transition: transform var(--speed) ease, border-color var(--speed) ease;
}
.social-grid a:hover .social-grid__chip {
  transform: translateY(-2px);
  border-color: var(--b-ico, var(--b-bg));
}
.social-grid__chip svg { width: 19px; height: 19px; }
.social-grid__label {
  font-size: .6875rem; line-height: 1.25; text-align: center; color: var(--ink-3);
  overflow-wrap: anywhere;
}
.social-grid a:hover .social-grid__label { color: var(--ink); }

/* ---- middle column ---- */
.contact-cards { display: grid; gap: 1rem; }
.info-card {
  display: grid; grid-template-columns: 3rem minmax(0, 1fr); gap: 1rem;
  padding: 1.25rem 1.35rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
}
.info-card__badge {
  display: flex; align-items: center; justify-content: center;
  width: 3rem; height: 3rem; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
}
.info-card__badge svg { width: 20px; height: 20px; }
.info-card__label { font-size: 1rem; font-weight: 700; color: var(--ink); margin-bottom: .2rem; }
.info-card__value { font-size: .9375rem; color: var(--ink-2); margin-bottom: .25rem; word-break: break-word; }
.info-card__value a { font-weight: 500; }
.info-card__note { font-size: .8125rem; color: var(--ink-3); margin: 0; }

/* ---- right column ---- */
.contact-aside { padding-top: 1.5rem; }
.contact-script {
  font-family: Caveat, "Segoe Script", cursive;
  font-size: clamp(1.4rem, 2.6vw, 1.85rem);
  line-height: 1.25; color: var(--ink); margin: 0;
}
.contact-script::after {
  content: ""; display: block; width: 4.5rem; height: 2px; margin-top: .75rem;
  border-radius: 2px; background: linear-gradient(90deg, var(--accent), transparent);
}

/* ---- footer ---- */
.site-footer {
  border-top: 1px solid var(--rule);
  background: var(--surface);
  padding-block: 1.5rem 1.75rem;
  font-size: .82rem; color: var(--ink-3);
}
.footer__inner {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: .75rem 1.5rem; justify-content: space-between;
}
.foot__copy { margin: 0; }

/* Back to top */
.to-top {
  position: fixed; right: 1.1rem; bottom: 1.1rem; z-index: 90;
  width: 2.75rem; height: 2.75rem; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent); color: var(--on-accent);
  box-shadow: var(--shadow-fab); cursor: pointer;
  opacity: 0; visibility: hidden; transform: translateY(8px);
  transition: opacity var(--speed) ease, transform var(--speed) ease,
              visibility var(--speed) ease, background var(--speed) ease;
}
.to-top.is-on { opacity: 1; visibility: visible; transform: none; }
.to-top:hover { background: var(--accent-hover); }
.to-top .ico { width: 17px; height: 17px; }

/* Image modal */
.modal {
  position: fixed; inset: 0; z-index: 150;
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.modal[hidden] { display: none !important; }
.modal__box {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  padding: .75rem;
  max-width: min(56rem, 100%);
  max-height: 90vh;
  overflow: auto;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
}
.modal__box img {
  display: block; max-width: 100%; max-height: 70vh;
  object-fit: contain; border-radius: var(--r-md); margin-inline: auto;
}
.modal__cap { margin-top: .7rem; font-size: .82rem; color: var(--ink-3); text-align: center; }
.modal__close {
  position: absolute; top: -.7rem; right: -.7rem;
  width: 2.2rem; height: 2.2rem; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--rule-strong);
  box-shadow: var(--shadow-card); cursor: pointer;
}
.modal__close:hover { color: var(--accent); border-color: var(--accent); }
.modal__close .ico { width: 15px; height: 15px; }

/* ===========================================================================
   11. RESPONSIVE
   =========================================================================== */
/* One row only works while there is room for it. */
@media (max-width: 1040px) {
  .icards { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .icard:nth-child(3n + 1) { border-left: 0; }
  .icard:nth-child(n + 4) { border-top: 1px solid var(--rule); }
}

@media (max-width: 640px) {
  .icards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .icard:nth-child(3n + 1) { border-left: 1px solid var(--rule); }
  .icard:nth-child(2n + 1) { border-left: 0; }
  .icard:nth-child(n + 3) { border-top: 1px solid var(--rule); }
}

@media (max-width: 420px) {
  .icards { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 1040px) {
  .contact-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .contact-aside { grid-column: 1 / -1; padding-top: 0; }
  .contact-script::after { margin-inline: 0; }
}

@media (max-width: 760px) {
  .contact-layout { grid-template-columns: minmax(0, 1fr); }
  /* One column means the copy would run across the photograph. */
  .section--contact::after { display: none; }
}

@media (max-width: 400px) {
  .social-grid { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem .55rem; }
}

@media (max-width: 900px) {
  .news-grid { grid-template-columns: minmax(0, 1fr); }
  .photo-frame { max-width: 34rem; margin-inline: auto; }
  .scroll-box--auto { max-height: 21rem; }
}

@media (max-width: 860px) {
  .nav { display: none; }
  .menu-btn { display: inline-flex; }
  .hero__top { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .hero__visual { order: -1; justify-self: center; }
  .hero__bio { margin-inline: auto; }
  .hero__actions { justify-content: center; }
  .hero__interests { text-align: center; }
  .pills { justify-content: center; }
}

/* ---------------------------------------------------------------------------
   Touch: on a phone every link and toggle needs a finger-sized hit area, not a
   text-sized one. WCAG 2.5.8 sets 24x24 as the floor; these go to ~40 where it
   costs nothing, using padding so the visible text does not grow.

   `pointer: coarse` rather than a width query, so a small laptop keeps the
   tighter desktop spacing and a large tablet still gets the bigger targets.
   --------------------------------------------------------------------------- */
@media (pointer: coarse) {
  .pub__links { gap: .35rem 1.1rem; }
  .pub__links a { padding-block: .5rem; }
  .pub__links a[data-link="award"] { padding-block: .45rem; }

  .pub__abstract summary { padding-block: .55rem; }

  .info-card__value a { display: inline-block; padding-block: .45rem; }

  .carousel__btn { width: 2.6rem; height: 2.6rem; }
  .carousel__dot { width: 12px; height: 12px; }

  .proj__demo-btn, .proj__repo, .pub-more { padding-block: .6rem; }

  .chip--jump { padding-block: .5rem; }

  .to-top { width: 3rem; height: 3rem; }
}

/* The smallest type on the page is set for a desktop reading distance. On a
   phone 10-11px is below what most people can read comfortably, so the
   metadata sizes step up. Nothing above 13px changes. */
@media (max-width: 560px) {
  .proj__tag { font-size: .8125rem; }
  .proj__tech li { font-size: .8125rem; }
  .proj__status { font-size: .8125rem; }
  .proj__models li { font-size: .8438rem; }
  .proj__models-label { font-size: .75rem; }
  .news-card__date { font-size: .75rem; }
  .badge-new { font-size: .6875rem; }
  .social-grid__label { font-size: .75rem; }
  .pub__venue { font-size: .8125rem; }
  .entry__dates { font-size: .8125rem; }
  .carousel__count { font-size: .8125rem; }
}

@media (max-width: 560px) {
  .icard { border-left: 0; border-top: 1px solid var(--rule); padding-inline: 0; }
  .icard:first-child { border-top: 0; padding-top: .35rem; }
  .pub { grid-template-columns: minmax(0, 1fr); gap: .85rem; }
  .pub__thumb { width: 100%; height: auto; aspect-ratio: 2 / 1; }
  .pub__head { flex-direction: column; align-items: flex-start; gap: .25rem; }
  .pub__venue { white-space: normal; }
  .entry__head { flex-direction: column; align-items: flex-start; gap: .2rem; }
  .timeline { padding-left: 1.4rem; }
  .timeline > li::before { left: -1.4rem; width: 10px; height: 10px; }
  .timeline::before { left: 4px; }
  .scroll-box { max-height: 19rem; }
  .modal { padding: 1rem; }
  .modal__close { top: -.5rem; right: -.5rem; }
}

@media (max-width: 380px) {
  :root { --gutter: 1rem; }
  .btn { padding: .55rem .9rem; font-size: .82rem; }
  .social-btn { width: 2.5rem; height: 2.5rem; }
  .pub__links { gap: .7rem; }
}

/* ===========================================================================
   12. MOTION / PRINT
   =========================================================================== */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
  .pub:hover, .btn:hover, .social-btn:hover, .pub__thumb:hover { transform: none; }
  /* No pulsing badge, and the JS auto-scroll never starts either. */
  .badge-new, .badge-new__dot { animation: none !important; }
}

@keyframes float-soft {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 10px 30px var(--accent-ring); }
  50% { box-shadow: 0 16px 38px color-mix(in srgb, var(--accent) 24%, transparent); }
}

@keyframes fade-up {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

#main > .hero { animation: fade-up .7s ease both; }
#main > .section { animation: fade-up .7s ease both; }
#main > .section:nth-of-type(2) { animation-delay: .05s; }
#main > .section:nth-of-type(3) { animation-delay: .10s; }
#main > .section:nth-of-type(4) { animation-delay: .15s; }
#main > .section:nth-of-type(5) { animation-delay: .20s; }
#main > .section:nth-of-type(6) { animation-delay: .25s; }

.hero__text { animation: fade-up .8s ease .05s both; }
.hero__visual { animation: fade-up .8s ease .12s both; }
.hero__actions { animation: fade-up .8s ease .18s both; }
.hero__interests { animation: fade-up .8s ease .24s both; }

@media print {
  .site-header, .to-top, .modal, .carousel, .chips, .filter-status, .skip-link { display: none !important; }
  body { background: #fff; color: #000; }
  .section, .hero { background: #fff !important; padding-block: 1rem; }
  .card, .pub, .entry, .thread { border: 1px solid #ccc !important; box-shadow: none !important; }
  .scroll-box { max-height: none !important; overflow: visible !important; }
  .pub__abstract[open] p { background: transparent; }
  a { color: #000; }
}

      abstract: "Imbalanced datasets pose significant challenges to the reliability and robustness of visual classification systems, particularly in critical applications like solar panel dust detection. Conventional data augmentation techniques, such as Synthetic Minority Over-Sampling Technique (SMOTE) or generative models like Stable Diffusion, independently demonstrate limitations, either by lacking structural diversity or failing to sufficiently address feature-space imbalance. To overcome these constraints, this paper proposes DiSMHA (Diffusion-SMOTE Hybrid Augmentation), an innovative framework integrating pixel-level image synthesis using Stable Diffusion and feature-level oversampling via SMOTE. DiSMHA systematically balances and enriches minority class representation by producing high-quality synthetic images coupled with robust feature interpolation in the latent space. Experiments conducted on four imbalanced solar panel image dataset cases demonstrate substantial improvements across multiple performance metrics, particularly accuracy, recall and F1-score, emphasizing effective minority class detection. The proposed DiSMHA approach was evaluated using several classification models, including Support Vector Machine (SVM), Multilayer Perceptron (MLP), XGBoost, Vision Transformer (ViT-Head), and TabNet. These models achieved notable accuracies ranging from 94% to 98%, significantly outperforming baseline methods. Particularly, the MLP (with accuracy 96.67%) and SVM (with accuracy 94.67%) models exhibited substantial performance gains, confirming DiSMHA’s capacity to enhance traditionally imbalance-sensitive classifiers. Comparative analyses further underscored the superiority of DiSMHA, highlighting its consistent accuracy, enhanced recall, and improved F1-scores over individual augmentation approaches. Moreover, statistical validation using the Wilcoxon signed rank test confirmed the significant superiority of our approach for minority class detection in highly imbalanced scenarios. Thus, DiSMHA represents a scalable, robust solution applicable across diverse domains facing imbalanced classification challenges, including industrial inspection, medical imaging, and rare event detection."

      abstract: "Imbalanced datasets pose a significant challenge in developing predictive models for solar panel fault detection, particularly for identifying dust accumulation on photovoltaic (PV) modules. This study addresses class imbalance in 842 polycrystalline silicon (poly-Si) PV module images (502 clean, 340 dusty) from the publicly available SolNET dataset collected across dusty regions of Bangladesh. All images were processed as 3-channel RGB inputs and resized to 224 × 224 pixels for CNN training (camera metadata and capture parameters such as irradiance, temperature, and distance are not provided in the dataset release). Two complementary augmentation strategies were employed: feature-level SMOTE (Synthetic Minority Over-Sampling Technique) and image-level Stable Diffusion augmentation. Stable Diffusion generated 162 photorealistic dusty-panel images, retained through a two-stage validation protocol combining visual screening and feature-space similarity testing (FID = 63.86, KID = 0.0220, pHash duplicates = 0 %), ensuring realism and diversity. Three convolutional neural networks (VGG-16, ResNet50, and MobileNetV3) were evaluated using stratified 10-fold cross-validation, with performance assessed by accuracy, F1-score, Cohen’s κ, and Matthews correlation coefficient (MCC). Results showed consistent improvements; for example, VGG-16 accuracy increased from 84.6 % (imbalanced) to 93.5 % (SMOTE) and 97.6 % (Stable Diffusion), while ResNet50 achieved 98.9 % with Stable Diffusion. Cross-validation confirmed robust performance (VGG-16: 95.6 % ± 1.7 % accuracy, κ = 0.91 ± 0.02, MCC = 0.93 ± 0.02), and Wilcoxon signed-rank testing verified statistical significance (p < 0.05). Constraints include reliance on a single public dataset, binary dust/clean labeling, uniform resizing, and restriction to poly-Si modules, which may limit generalization to other PV technologies and field conditions. Overall, the findings indicate that combining feature-level oversampling with diffusion-based image augmentation reduces false negatives and improves sensitivity to dusty panels, motivating further validation on larger, multi-technology PV datasets."
