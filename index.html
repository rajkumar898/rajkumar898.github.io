    if (!items.length) return null;

    var list = el("ul", { class: "news-list" }, items.map(function (item) {
      var fresh = isRecent(item);
      return el("li", { class: "card news-card" + (fresh ? " is-new" : "") }, [
        el("span", { class: "news-card__ico" }, [icon(item.kind || "flag")]),
        el("div", null, [
          el("p", { class: "news-card__text" }, [
            el("span", { class: "news-card__date" }, [txt(item.date, "TODO")]),
            safeInline(item.text),
            fresh ? el("span", { class: "badge-new" }, [
              el("span", { class: "badge-new__dot", "aria-hidden": "true" }),
              el("span", { text: "New" })
            ]) : null
          ])
        ])
      ]);
    }));

    var box = el("div", {
      class: "scroll-box scroll-box--auto", tabindex: "0", role: "region",
      "aria-label": "News, scrollable list"
    }, [list]);

    autoScroll(box);

    var cols = [
      el("div", { class: "news-col" }, [
        el("h2", { class: "section-title", id: "news-title", text: cfg.title }),
        el("div", { class: "scroll-shell" }, [box])
      ])
    ];

    /* The Photos column has its own list so the hero and this section can
       drift apart as you add more. Until galleryPhotos has entries of its own
       it shows the same set the hero does. */
    var photos = (SITE.galleryPhotos && SITE.galleryPhotos.length
                    ? SITE.galleryPhotos : (SITE.photos || []))
                 .filter(function (ph) { return ph && has(ph.src); });
    if (photos.length) {
      var gallery = buildCarousel(photos);
      gallery.setAttribute("aria-label", "Photographs");
      cols.push(el("div", { class: "photo-col" }, [
        el("h2", { class: "section-title", id: "photos-title", text: "Photos" }),
        el("div", { class: "photo-frame" }, [gallery])
      ]));
    }

    return el("section", {
      class: "section" + (cfg.alt ? " section--alt" : ""),
      id: cfg.id, "aria-labelledby": "news-title"
    }, [el("div", { class: "wrap news-grid" + (photos.length ? "" : " news-grid--solo") }, cols)]);
  }

  /* Slow, continuous auto-scroll for the updates list.

     It pauses while the pointer is over the box, while anything inside it has
     keyboard focus, while the visitor is scrolling it themselves, and while
     the tab is in the background. It does not run at all for a visitor who has
     asked for reduced motion, and it never starts if the content already fits
     — an auto-scroll with nowhere to go just jitters. */
  function autoScroll(box) {
    var reduced = typeof window.matchMedia === "function" &&
                  window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) return;

    var SPEED = 0.35;      /* pixels per frame — deliberately slow */
    var PAUSE_AT_END = 1600;
    var RESUME_AFTER = 2500;

    var offset = 0, paused = false, raf = null, resumeTimer = null, holdUntil = 0;

    function pause() { paused = true; }
    function resume() { paused = false; }
    function holdThenResume() {
      paused = true;
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(function () { paused = false; }, RESUME_AFTER);
    }

    box.addEventListener("mouseenter", pause);
    box.addEventListener("mouseleave", resume);
    box.addEventListener("focusin", pause);
    box.addEventListener("focusout", function (e) {
      if (!box.contains(e.relatedTarget)) resume();
    });
    box.addEventListener("wheel", holdThenResume, { passive: true });
    box.addEventListener("touchstart", pause, { passive: true });
    box.addEventListener("touchend", holdThenResume, { passive: true });
    box.addEventListener("keydown", holdThenResume);

    function step(now) {
      raf = requestAnimationFrame(step);
      if (paused || document.hidden || now < holdUntil) return;

      var max = box.scrollHeight - box.clientHeight;
      if (max <= 4) return;                       /* nothing to scroll */

      offset += SPEED;
      if (offset >= max) {
        offset = 0;
        box.scrollTop = 0;
        holdUntil = now + PAUSE_AT_END;           /* breathe at the top */
        return;
      }
      box.scrollTop = offset;
    }

    /* Keep the internal offset honest when someone scrolls by hand. */
    box.addEventListener("scroll", function () {
      if (paused) offset = box.scrollTop;
    }, { passive: true });

    requestAnimationFrame(function (t) { holdUntil = t + PAUSE_AT_END; step(t); });
  }

  function buildCarousel(photos) {
    var viewport = el("div", { class: "carousel__viewport" });

    var reduced = typeof window.matchMedia === "function" &&
                  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var videos = [];
    var slides = photos.map(function (ph, i) {
      var label = has(ph.alt) ? ph.alt : "Photo " + (i + 1);
      var media;

      if (ph.video) {
        /* The source files carry no audio track at all (ffmpeg -an), so these
           are silent whatever the browser does with the muted attribute.
           `muted` is also set as a property because Safari ignores the
           attribute when it decides whether autoplay is allowed. Someone who
           has asked for reduced motion gets controls instead of autoplay. */
        media = el("video", {
          class: "carousel__video",
          src: ph.src,
          poster: has(ph.poster) ? ph.poster : null,
          preload: i === 0 ? "auto" : "metadata",
          muted: true, loop: true, playsinline: true,
          "webkit-playsinline": "true",
          autoplay: reduced ? null : true,
          controls: reduced ? true : null,
          "aria-label": label
        });
        media.muted = true;
        media.defaultMuted = true;
        media.volume = 0;
        videos.push(media);
      } else {
        media = safeImg(ph.src, label, "", placeholderPhoto());
        media.setAttribute("loading", i === 0 ? "eager" : "lazy");
      }

      /* Where the crop should hold on to when the photo is taller than the
         16:10 frame — the face, rather than the middle of the picture. */
      if (has(ph.focus)) media.style.objectPosition = ph.focus;

      var slide = el("div", {
        class: "carousel__slide" + (i === 0 ? " is-active" : ""),
        role: "group", "aria-roledescription": "slide",
        "aria-label": (i + 1) + " of " + photos.length
      }, [
        media,
        has(ph.caption) ? el("p", { class: "carousel__caption", text: ph.caption }) : null
      ]);
      if (i !== 0) slide.setAttribute("aria-hidden", "true");
      viewport.appendChild(slide);
      return slide;
    });

    /* A dot per slide stops being navigation once there are a dozen of them —
       33 dots overflow the frame and no one can aim at one. Past ten, the row
       becomes a plain "4 / 33" counter; the arrows and arrow keys still move
       through every slide. */
    var manySlides = photos.length > 10;
    var dots = manySlides ? [] : photos.map(function (ph, i) {
      return el("button", {
        type: "button", class: "carousel__dot",
        "aria-current": i === 0 ? "true" : "false"
      }, [el("span", { class: "sr-only", text: "Go to photo " + (i + 1) })]);
    });
    var counter = manySlides
      ? el("p", { class: "carousel__count", text: "1 / " + photos.length })
      : null;

    var prev = el("button", { type: "button", class: "carousel__btn carousel__btn--prev" },
      [el("span", { class: "sr-only", text: "Previous photo" }), icon("prev", "ico")]);
    var next = el("button", { type: "button", class: "carousel__btn carousel__btn--next" },
      [el("span", { class: "sr-only", text: "Next photo" }), icon("next", "ico")]);

    var root = el("div", {
      class: "carousel", role: "region",
      "aria-roledescription": "carousel", "aria-label": "Photos"
    }, [viewport, prev, next, counter,
        manySlides ? null : el("div", { class: "carousel__dots" }, dots)]);

    var at = 0;
    function show(i) {
      at = (i + slides.length) % slides.length;
      slides.forEach(function (s, k) {
        s.classList.toggle("is-active", k === at);
        if (k === at) s.removeAttribute("aria-hidden");
        else s.setAttribute("aria-hidden", "true");
      });
      dots.forEach(function (d, k) { d.setAttribute("aria-current", k === at ? "true" : "false"); });
      if (counter) counter.textContent = (at + 1) + " / " + slides.length;

      /* Only the visible video runs. An off-screen one would burn battery and,
         on a slow connection, buffer against the photo that is actually up. */
      videos.forEach(function (v) {
        var onStage = slides[at].contains(v);
        try {
          if (onStage && !reduced) {
            var playing = v.play();
            if (playing && typeof playing.catch === "function") playing.catch(function () {});
          } else if (!v.paused) {
            v.pause();
          }
        } catch (e) { /* a browser that refuses autoplay just shows the poster */ }
      });
    }

    /* Autoplay. It pauses while someone is hovering or tabbing through the
       controls and while the tab is in the background, and a manual move
       restarts the clock rather than killing it — so the slideshow keeps
       running after you click an arrow. It never starts at all for a visitor
       who has asked for reduced motion. */
    var canAuto = !reduced && slides.length > 1;
    var delay = SITE.carouselDelay || 4500;
    var videoDelay = SITE.carouselVideoDelay || 9000;
    var timer = null;

    function stop() { if (timer) { clearTimeout(timer); timer = null; } }
    function start() {
      stop();
      if (!canAuto || document.hidden) return;
      /* A still gets the usual beat; a clip is held longer so it is not cut
         off two seconds in. setTimeout rather than setInterval because the
         wait now changes from slide to slide. */
      var wait = photos[at] && photos[at].video ? videoDelay : delay;
      timer = setTimeout(function () { show(at + 1); start(); }, wait);
    }
    function nudge(i) { show(i); start(); }

    prev.addEventListener("click", function () { nudge(at - 1); });
    next.addEventListener("click", function () { nudge(at + 1); });
    dots.forEach(function (d, i) { d.addEventListener("click", function () { nudge(i); }); });

    root.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { nudge(at - 1); e.preventDefault(); }
      if (e.key === "ArrowRight") { nudge(at + 1); e.preventDefault(); }
    });

    root.addEventListener("mouseenter", stop);
    root.addEventListener("mouseleave", start);
    root.addEventListener("focusin", stop);
    root.addEventListener("focusout", function (e) {
      if (!root.contains(e.relatedTarget)) start();
    });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) stop(); else start();
    });

    show(0);
    start();
    return root;
  }

  /* ------------------------------- research ------------------------------ */
  function renderResearch(cfg) {
    var threads = SITE.threads || [];
    if (!threads.length) return null;

    var wrap = el("div", { class: "threads" }, threads.map(function (t) {
      var pubs = (SITE.publications || []).filter(function (p) { return p.thread === t.id; });
      return el("article", { class: "card thread" }, [
        has(t.label) ? el("p", { class: "thread__eyebrow", text: t.label }) : null,
        el("h3", { class: "thread__title" }, [txt(t.title)]),
        el("div", { class: "thread__body" }, [el("p", null, [txt(t.body)])]),
        pubs.length ? el("ul", { class: "thread__pubs", "aria-label": "Publications in this thread" },
          pubs.map(function (p) {
            return el("li", null, [
              el("a", { href: "#pub-" + p.id }, [txt(p.title, "TODO — untitled")]),
              (has(p.venue) || has(p.year))
                ? document.createTextNode(" — " + [p.venue, p.year].filter(has).join(", "))
                : null
            ]);
          })) : null
      ]);
    }));

    return sectionShell(cfg, [wrap]);
  }

  /* ------------------------------- projects ------------------------------ */
  /* How many cards each project group shows before its toggle. */
  var PROJECTS_SHOWN = 1;

  function renderProjects(cfg) {
    var items = SITE.projects || [];
    if (!items.length) return null;

    function projCard(p) {
      /* A demo clip carries narration, so it is never set to autoplay: poster
         frame, ordinary controls, and nothing plays until someone asks. */
      /* One collapsed player. `label` names it in the button, e.g.
         "Show demo video" or "Show Scientific explainer". The file is not
         fetched until the button is pressed, and hiding it pauses playback —
         otherwise closing the panel leaves audio running with nothing on
         screen to stop it. */
      function clipBlock(id, label, src, poster, alt) {
        var video = el("video", {
          class: "proj__demo",
          poster: has(poster) ? poster : null,
          controls: true, preload: "none", playsinline: true, muted: true,
          "aria-label": has(alt) ? alt
                                 : (label + " for " + (has(p.title) ? p.title : "this project"))
        });
        video.muted = true;
        video.defaultMuted = true;

        var wrap = el("div", { class: "proj__demo-wrap", id: id }, [video]);
        wrap.hidden = true;

        var text = el("span", { text: "Show " + label });
        var btn = el("button", {
          type: "button", class: "proj__demo-btn",
          "aria-expanded": "false", "aria-controls": id
        }, [icon("chevron", "ico chev"), text]);

        btn.addEventListener("click", function () {
          var open = btn.getAttribute("aria-expanded") === "true";
          wrap.hidden = open;
          btn.setAttribute("aria-expanded", String(!open));
          text.textContent = (open ? "Show " : "Hide ") + label;
          if (open) {
            try { video.pause(); } catch (e) {}
          } else if (!video.getAttribute("src")) {
            video.setAttribute("src", src);
          }
        });

        return el("div", { class: "proj__demo-block" }, [btn, wrap]);
      }

      var demoBlock = null;
      if (has(p.demo)) {
        demoBlock = clipBlock(p.id + "-demo", "demo video", p.demo, p.demoPoster, p.demoAlt);
      } else if (p.videos && p.videos.length) {
        var clips = p.videos.filter(function (v) { return v && has(v.src); });
        if (clips.length) {
          demoBlock = el("div", { class: "proj__clips" }, clips.map(function (v, k) {
            return clipBlock(p.id + "-clip-" + (k + 1), v.label || ("clip " + (k + 1)),
                             v.src, v.poster, v.alt);
          }));
        }
      }

      /* Models and tools, one compact line each. */
      var modelList = null;
      if (p.models && p.models.length) {
        modelList = el("div", { class: "proj__models" }, [
          el("p", { class: "proj__models-label", text: "Models & tools" }),
          el("ul", null, p.models.map(function (m) {
            return el("li", null, [
              el("b", { text: m.name }),
              document.createTextNode(" \u2013 " + m.role)
            ]);
          }))
        ]);
      }

      return el("li", { class: "card proj" }, [
        el("h3", { class: "proj__title" }, [txt(p.title)]),
        has(p.status) ? el("p", { class: "proj__status", text: p.status }) : null,
        (p.tags && p.tags.length)
          ? el("ul", { class: "proj__tags" }, p.tags.map(function (t) {
              return el("li", { class: "proj__tag", text: t });
            }))
          : null,
        has(p.overview) ? el("p", { class: "proj__overview", text: p.overview }) : null,
        (p.highlights && p.highlights.length)
          ? el("ul", { class: "proj__highlights" }, p.highlights.map(function (h) {
              return el("li", { text: h });
            }))
          : null,
        modelList,
        /* Only rendered when the project has a `repo`; every other card is
           untouched. */
        has(p.repo)
          ? el("p", { class: "proj__links" }, [
              el("a", {
                class: "proj__repo", href: encodeURI(p.repo),
                rel: "noopener", target: "_blank",
                "aria-label": "View " + (has(p.title) ? p.title : "this project") + " on GitHub"
              }, [icon("github", "ico"), el("span", { text: "View on GitHub" })])
            ])
          : null,
        demoBlock,
        (p.tech && p.tech.length)
          ? el("ul", { class: "proj__tech" }, p.tech.map(function (t) {
              return el("li", { text: t });
            }))
          : null
      ]);
    }

    /* Group in the order SITE.projectGroups gives, with the last group acting
       as the catch-all so an unrecognised `group` still shows up. */
    var defs = (SITE.projectGroups || []).slice();
    if (!defs.length) {
      defs = [{ key: null, id: "proj-all", title: cfg.title, chip: "All" }];
    }
    var known = defs.map(function (g) { return g.key; });

    var groups = defs.map(function (g, gi) {
      var last = gi === defs.length - 1;
      return {
        def: g,
        items: items.filter(function (p) {
          return p.group === g.key || (last && known.indexOf(p.group) === -1);
        })
      };
    }).filter(function (g) { return g.items.length; });

    var children = groups.map(function (g) {
      var cards = g.items.map(projCard);
      var listId = g.def.id + "-list";
      var list = el("ol", { class: "proj-grid", id: listId }, cards);
      var kids = [groupHead(g.def.title), list];

      var extra = cards.length - PROJECTS_SHOWN;
      if (extra > 0) {
        cards.forEach(function (c, i) { c.hidden = i >= PROJECTS_SHOWN; });

        var label = el("span", { text: "Show " + extra + " more" });
        var more = el("button", {
          type: "button", class: "pub-more",
          "aria-expanded": "false", "aria-controls": listId
        }, [label, icon("chevron", "ico chev")]);

        more.addEventListener("click", function () {
          var open = more.getAttribute("aria-expanded") === "true";
          cards.forEach(function (c, i) { c.hidden = open && i >= PROJECTS_SHOWN; });
          more.setAttribute("aria-expanded", String(!open));
          label.textContent = open ? ("Show " + extra + " more") : "Show fewer";
          if (open) {
            var top = document.getElementById(g.def.id);
            if (top && top.getBoundingClientRect().top < 0) top.scrollIntoView();
          }
        });

        kids.push(more);
      }

      return el("section", { class: "proj-group", id: g.def.id, "aria-label": g.def.title }, kids);
    });

    /* The counted bar above the groups, as in Publications. These are anchors,
       not filters; each one opens the group it lands on. */
    if (groups.length > 1) {
      children.unshift(el("nav", { class: "pubs-bar", "aria-label": "Jump to a project group" },
        [el("div", { class: "chips" }, groups.map(function (g) {
          var a = el("a", { class: "chip chip--jump", href: "#" + g.def.id }, [
            el("span", { class: "chip__n", text: String(g.items.length) }),
            el("span", { text: g.def.chip || g.def.title })
          ]);
          a.addEventListener("click", function () {
            var sec = document.getElementById(g.def.id);
            var btn = sec && sec.querySelector(".pub-more");
            if (btn && btn.getAttribute("aria-expanded") === "false") btn.click();
          });
          return a;
        }))]));
    }

    return sectionShell(cfg, children);
  }

  /* ----------------------------- publications ---------------------------- */
  var LINK_LABELS = {
    doi: "DOI", pdf: "PDF", code: "Code", dataset: "Dataset",
    page: "Publisher page",
    slides: "Slides", poster: "Poster", video: "Video",
    award: "Best Paper Award"
  };

  /* The award link is the one that is not a copy of the paper, so it gets the
     trophy and stands out from the row of file links beside it. */
  var LINK_ICONS = { award: "trophy", page: "external" };

  function authorLine(authors) {
    var aliases = (SITE.profile.nameAliases || []).map(function (a) { return a.toLowerCase().trim(); });
    var p = el("p", { class: "pub__authors" });
    if (!authors || !authors.length) { p.appendChild(txt("", "TODO — author list")); return p; }
    authors.forEach(function (a, i) {
      if (i > 0) p.appendChild(document.createTextNode(", "));
      if (!has(a)) { p.appendChild(txt("", "TODO \u2014 remaining inventors as filed")); return; }
      var me = aliases.indexOf(String(a).toLowerCase().trim()) !== -1;
      p.appendChild(me ? el("strong", { class: "me", text: a }) : document.createTextNode(a));
    });
    return p;
  }

  function pubCard(pub) {
    var review = pub.status === "under-review";

    /* An entry can opt out of a figure entirely with `thumb: null` — some
       work has no diagram to show, and a placeholder box is worse than
       nothing. "" still draws the placeholder, for a figure yet to arrive. */
    var noFigure = pub.thumb === null;

    var thumbAlt = has(pub.thumbAlt) ? pub.thumbAlt
                 : ("Figure from " + (has(pub.title) ? pub.title : "this entry"));
    var thumb = noFigure ? null : safeImg(pub.thumb, thumbAlt, "pub__thumb", placeholderThumb());
    if (thumb) {
      thumb.setAttribute("role", "button");
      thumb.setAttribute("tabindex", "0");
      thumb.setAttribute("aria-label", "Enlarge figure: " + thumbAlt);
      thumb.addEventListener("click", function () {
        openModal(thumb.src, thumbAlt, has(pub.title) ? pub.title : "");
      });
      thumb.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openModal(thumb.src, thumbAlt, has(pub.title) ? pub.title : "");
        }
      });
    }

    var href = has(pub.links && pub.links.doi) ? pub.links.doi
             : (has(pub.links && pub.links.pdf) ? pub.links.pdf : null);
    var titleInner = href
      ? el("a", { href: encodeURI(href), rel: "noopener", target: "_blank" }, [txt(pub.title)])
      : txt(pub.title, "TODO — title");

    var venueNode = review
      ? el("span", { class: "pub__venue pub__venue--review",
                     text: has(pub.label) ? pub.label : "Under review" })
      : el("span", { class: "pub__venue" }, [
          /* A full date wins over the bare year when one is given. */
          (has(pub.venue) || has(pub.date) || has(pub.year))
            ? document.createTextNode(
                [pub.venue, has(pub.date) ? pub.date : pub.year].filter(has).join(" \u00b7 "))
            : txt("", "TODO venue")
        ]);

    var body = el("div", { class: "pub__body" }, [
      el("div", { class: "pub__head" }, [
        el("h4", { class: "pub__title" }, [titleInner]),
        venueNode
      ]),
      has(pub.titleAlt)
        ? el("p", { class: "pub__title-alt", lang: pub.titleAltLang || null,
                    text: pub.titleAlt })
        : null,
      authorLine(pub.authors)
    ]);

    var keys = Object.keys(pub.links || {}).filter(function (k) { return has(pub.links[k]); });
    /* The award link is named by the certificate it opens — `awardLabel` on the
       entry wins over the generic "Best Paper Award", so a presentation award
       is not quietly relabelled as a paper award. */
    function linkLabel(k) {
      if (k === "award" && has(pub.awardLabel)) return pub.awardLabel;
      return LINK_LABELS[k] || k;
    }

    if (keys.length) {
      body.appendChild(el("div", { class: "pub__links" }, keys.map(function (k) {
        return el("a", {
          href: encodeURI(pub.links[k]), rel: "noopener", target: "_blank",
          "data-link": k,
          "aria-label": linkLabel(k) + " for " + (has(pub.title) ? pub.title : "this entry")
        }, [icon(LINK_ICONS[k] || k), el("span", { text: linkLabel(k) })]);
      })));
    }

    /* Filing line. A field still reading TODO prints as a muted note rather
       than being dropped, so nothing looks finished that is not. */
    if (has(pub.office) || pub.number !== undefined || pub.filed !== undefined) {
      var parts = [];
      if (has(pub.office)) parts.push(document.createTextNode(pub.office));
      if (pub.number !== undefined) {
        parts.push(el("span", null, [
          document.createTextNode("Application No. "),
          txt(pub.number, "TODO \u2014 number")
        ]));
      }
      if (pub.filed !== undefined) {
        parts.push(el("span", null, [
          document.createTextNode("Filed "),
          txt(pub.filed, "TODO \u2014 month")
        ]));
      }
      var line = el("p", { class: "pub__patno" });
      parts.forEach(function (node, i) {
        if (i > 0) line.appendChild(document.createTextNode(" · "));
        line.appendChild(node);
      });
      if (parts.length) body.appendChild(line);
    }

    body.appendChild(el("p", { class: "pub__tldr" }, [
      el("b", { text: "TL;DR: " }),
      txt(pub.tldr, "TODO — one-line plain-language summary")
    ]));

    if (pub.abstract !== undefined && pub.abstract !== null && String(pub.abstract).trim() !== "") {
      body.appendChild(el("details", { class: "pub__abstract" }, [
        el("summary", null, [icon("chevron", "ico chev"), el("span", { text: "Show Abstract" })]),
        el("p", null, [txt(pub.abstract, "TODO — abstract")])
      ]));
    }

    return el("article", {
      class: (pub.plain === true ? "pub pub--plain" : "card pub")
             + (noFigure ? " pub--no-figure" : ""),
      id: "pub-" + pub.id, "data-type": pub.type || "other"
    }, [thumb, body]);
  }

  /* The same heading treatment the Awards groups use: a title with a hairline
     running out to the right edge. No icon — there is no honest icon for a
     research theme, and a decorative one would just be noise. */
  function groupHead(title) {
    return el("div", { class: "group-head" },
      [el("h3", { class: "group-head__title", text: title })]);
  }

  /* How many papers each publication section shows before a "Show N more"
     toggle appears. 0 means no limit: every paper is on the page, which is
     the point of a publication list. */
  var PUBS_SHOWN = 0;

  function renderPublications(cfg) {
    var pubs = SITE.publications || [];
    var note = SITE.underReviewNote;
    if (!pubs.length && !has(note)) return null;

    /* Three sections, in this order. The type on each entry decides which one
       it lands in; anything with another type collects under "Other Work" so
       nothing can silently vanish off the page.

       There are no filter chips any more — the headings are the filter. A
       chip that hid a whole titled section would read as a bug. */
    var groups = [
      { id: "pubs-journal", title: "Journal Publications", chip: "Journal Papers", type: "journal" },
      { id: "pubs-conference", title: "Conference Publications", chip: "Conference Papers", type: "conference" }
    ].map(function (g) {
      g.items = pubs.filter(function (p) { return p.type === g.type; });
      return g;
    }).filter(function (g) { return g.items.length; });

    var loose = pubs.filter(function (p) {
      return p.type !== "journal" && p.type !== "conference";
    });
    if (loose.length) {
      groups.push({ id: "pubs-other", title: "Other Work", chip: "Other Work", items: loose });
    }

    /* Each section opens showing one paper. The rest are in the DOM but
       `hidden`, so they are out of the accessibility tree and out of the tab
       order until the toggle reveals them — a screen reader is not told about
       nine papers it cannot reach. */
    var children = groups.map(function (g) {
      var cards = g.items.map(pubCard);
      var listId = g.id + "-list";
      var list = el("div", { class: "pub-list", id: listId }, cards);
      var kids = [groupHead(g.title), list];

      var extra = PUBS_SHOWN > 0 ? cards.length - PUBS_SHOWN : 0;
      if (extra > 0) {
        cards.forEach(function (c, i) { c.hidden = i >= PUBS_SHOWN; });

        var word = extra === 1 ? " more" : " more";
        var label = el("span", { text: "Show " + extra + word });
        var more = el("button", {
          type: "button", class: "pub-more",
          "aria-expanded": "false", "aria-controls": listId
        }, [label, icon("chevron", "ico chev")]);

        more.addEventListener("click", function () {
          var open = more.getAttribute("aria-expanded") === "true";
          cards.forEach(function (c, i) { c.hidden = open && i >= PUBS_SHOWN; });
          more.setAttribute("aria-expanded", String(!open));
          label.textContent = open ? ("Show " + extra + word) : "Show fewer";
          /* Collapsing from far down the list would otherwise leave the
             visitor stranded below the section that just shrank. */
          if (open) {
            var top = document.getElementById(g.id);
            if (top && top.getBoundingClientRect().top < 0) top.scrollIntoView();
          }
        });

        kids.push(more);
      }

      return el("section", { class: "pub-group", id: g.id, "aria-label": g.title }, kids);
    });

    /* Under review: a sentence, not a shelf of cards. */
    if (has(note)) {
      children.push(el("div", { class: "pub-subhead", id: "pubs-review" }, [
        groupHead("Under Review / Ongoing"),
        el("p", { class: "pub-note" }, [safeInline(note)])
      ]));
    }

    /* The counted bar above the sections. These are anchors, not filters — the
       headings below already separate the work, so hiding a whole titled
       section behind a chip would read as a bug. Clicking one jumps to it;
       `scroll-padding-top` on <html> keeps it clear of the sticky header. */
    var tabs = groups.map(function (g) {
      return { href: "#" + g.id, label: g.chip, count: g.items.length };
    });
    /* Under Review and Patent each get a chip, at your request. Note they sit
       beside the published counts and read with the same weight, which is why
       they were left out before — the labels are the only thing telling a
       reader that these are not published work. */
    if (has(note) && SITE.underReviewCount) {
      tabs.push({ href: "#pubs-review", label: "Under Review / Ongoing",
                  count: SITE.underReviewCount });
    }
    var patents = (SITE.patents || []);
    if (patents.length) {
      tabs.push({ href: "#pubs-patent",
                  label: patents.length === 1 ? "Patent" : "Patents",
                  count: patents.length });
    }
    if (tabs.length > 1) {
      children.unshift(el("nav", { class: "pubs-bar", "aria-label": "Jump to a publication type" },
        [el("div", { class: "chips" }, tabs.map(function (t) {
          var a = el("a", { class: "chip chip--jump", href: t.href }, [
            el("span", { class: "chip__n", text: String(t.count) }),
            el("span", { text: t.label })
          ]);
          /* Jumping to a section that is showing one paper of five is a poor
             landing, so the chip opens it on the way. */
          a.addEventListener("click", function () {
            var sec = document.getElementById(t.href.slice(1));
            var btn = sec && sec.querySelector(".pub-more");
            if (btn && btn.getAttribute("aria-expanded") === "false") btn.click();
          });
          return a;
        }))]));
    }

    /* Patents reuse the publication card so the two subsections read alike.
       `status` is forced so the label renders as a status pill, not a venue. */
    var pats = (SITE.patents || []).map(function (p) {
      var c = Object.assign({}, p);
      c.status = "under-review";
      return c;
    });
    if (pats.length) {
      children.push(el("div", { class: "pub-subhead", id: "pubs-patent" }, [
        groupHead(pats.length === 1 ? "Patent" : "Patents"),
        el("div", { class: "pub-list" }, pats.map(pubCard))
      ]));
    }

    return sectionShell(cfg, children);
  }

  /* --------------------------- experience / edu -------------------------- */
  function entryCard(e) {
    var dates = [e.start, e.end]
      .filter(function (d) { return d !== undefined && d !== null && d !== ""; })
      .map(function (d) { return has(d) ? d : "TODO"; })
      .join(" – ");

    var role = has(e.link && e.link.href)
      ? el("a", { href: e.link.href }, [txt(e.role)])
      : txt(e.role);

    var kids = [
      el("div", { class: "entry__head" }, [
        el("h3", { class: "entry__role" }, [role]),
        dates ? el("span", { class: "entry__dates", text: dates }) : null
      ])
    ];

    /* Education cards lead with the degree; experience cards with the org. */
    if (has(e.degree)) kids.push(el("p", { class: "entry__sub" }, [txt(e.degree)]));

    kids.push(el("div", { class: "entry__org" }, [
      safeImg(e.logo, (e.org || e.role || "Institution") + " logo", "entry__logo", monogram(e.org || e.role)),
      el("span", { class: "entry__orgname" }, [
        /* The organisation's name links to the organisation, as the journal
           names do under Academic Services. The place stays plain text —
           it is not part of what the link points at. */
        (function () {
          var label = has(e.degree) ? txt(e.org || e.role) : txt(e.org);
          if (!has(e.orgUrl)) return label;
          return el("a", {
            class: "entry__orglink", href: encodeURI(e.orgUrl),
            rel: "noopener", target: "_blank"
          }, [label]);
        }()),
        has(e.place) ? el("span", { class: "place", text: " · " + e.place }) : null
      ])
    ]));

    if (e.desc !== undefined && String(e.desc).trim() !== "") {
      kids.push(el("p", { class: "entry__desc" }, [txt(e.desc, "TODO — description")]));
    }

    if (e.link && has(e.link.href) && has(e.link.label)) {
      var ext = /^https?:/i.test(e.link.href);
      kids.push(el("a", {
        class: "entry__link", href: e.link.href,
        rel: ext ? "noopener" : null, target: ext ? "_blank" : null
      }, [icon("external"), el("span", { text: e.link.label })]));
    }

    return el("div", { class: "card entry" }, kids);
  }

  function renderExperience(cfg) {
    var list = SITE.experience || [];
    if (!list.length) return null;
    return sectionShell(cfg, [
      el("ol", { class: "timeline" }, list.map(function (e) { return el("li", null, [entryCard(e)]); }))
    ]);
  }

  function eduCard(e) {
    var dates = [e.start, e.end]
      .filter(function (d) { return d !== undefined && d !== null && d !== ""; })
      .map(function (d) { return has(d) ? d : "TODO"; })
      .join(" \u2013 ");

    var head = el("div", { class: "edu-card__head" }, [
      el("div", null, [
        el("h3", { class: "edu-card__name" }, [
          has(e.orgUrl)
            ? el("a", { class: "entry__orglink", href: encodeURI(e.orgUrl),
                        rel: "noopener", target: "_blank" }, [txt(e.role)])
            : txt(e.role)
        ]),
        has(e.degree) ? el("p", { class: "edu-card__degree", text: e.degree }) : null,
        has(e.place)
          ? el("p", { class: "edu-card__place" }, [
              icon("pin"),
              el("span", { text: e.place })
            ])
          : null
      ]),
      dates ? el("span", { class: "edu-card__dates", text: dates }) : null
    ]);

    var rows = (e.details || []).filter(function (d) { return has(d.text); });
    var details = rows.length
      ? el("ul", { class: "edu-details" }, rows.map(function (d) {
          return el("li", null, [
            el("span", { class: "edu-details__ico" }, [icon(d.icon || "flag")]),
            el("span", { class: "edu-details__label", text: d.label }),
            el("span", { class: "edu-details__text", text: d.text })
          ]);
        }))
      : null;

    return el("div", { class: "card edu-card" }, [
      safeImg(e.logo, (e.role || "Institution") + " logo", "edu-card__logo", monogram(e.role)),
      el("div", { class: "edu-card__body" }, [head, details])
    ]);
  }

  function renderEducation(cfg) {
    var list = SITE.education || [];
    if (!list.length) return null;
    return sectionShell(cfg, [
      el("ol", { class: "edu-list" }, list.map(function (e) { return el("li", null, [eduCard(e)]); }))
    ]);
  }

  /* -------------------------------- awards ------------------------------- */
  function renderAwards(cfg) {
    var items = SITE.awards || [];
    if (!items.length) return null;
    var meta = SITE.awardsMeta || {};

    function card(a, g) {
      var variant = a.kind === "scholarship" ? " award--fund"
                  : a.kind === "service" ? " award--service" : "";
      /* A group marked `dated: false` carries its dates inside the text, so a
         year chip there would either repeat them or read as missing. */
      var wantsDate = !g || g.dated !== false;
      return el("li", { class: "award" + variant }, [
        el("span", { class: "award__ico" }, [icon((g && g.icon) || "trophy")]),
        el("div", { class: "award__body" }, [
          el("div", { class: "award__head" }, [
            el("h4", { class: "award__title" }, [txt(a.title)]),
            !wantsDate ? null
              : has(a.date) ? el("span", { class: "award__year", text: a.date })
                            : el("span", { class: "award__year todo", text: "date TBC" })
          ]),
          el("p", { class: "award__org" }, [txt(a.org)]),
          has(a.for) ? el("p", { class: "award__note" }, [
            el("span", { class: "award__for", text: "For: " }),
            document.createTextNode(a.for)
          ]) : null
        ])
      ]);
    }

    var groups = (meta.groups || [{ kind: null, title: "", cols: 2 }]).map(function (g) {
      var members = items.filter(function (a) { return !g.kind || a.kind === g.kind; });
      if (!members.length) return null;
      return el("div", { class: "award-group" }, [
        el("div", { class: "award-group__head" }, [
          el("span", { class: "award-group__ico" }, [icon(g.icon || "trophy")]),
          el("h3", { class: "award-group__title", text: g.title })
        ]),
        el("ul", { class: "awards-grid awards-grid--" + (g.cols || 2) },
           members.map(function (a) { return card(a, g); }))
      ]);
    }).filter(Boolean);

    var head = has(meta.eyebrow)
      ? el("div", { class: "section-head" }, [
          el("div", null, [
            el("p", { class: "contact-eyebrow" }, [el("span", { text: meta.eyebrow })]),
            el("h2", { class: "section-title", id: cfg.id + "-title", text: cfg.title })
          ]),
          (SITE.sectionQuotes && has(SITE.sectionQuotes[cfg.id]))
            ? el("p", { class: "section-quote",
                        text: "\u201C" + SITE.sectionQuotes[cfg.id] + "\u201D" })
            : null
        ])
      : sectionHead(cfg);

    var foot = (has(meta.footQuote) || (meta.tags && meta.tags.length))
      ? el("div", { class: "awards-foot" }, [
          el("span", { class: "awards-foot__ico" }, [icon("leaf")]),
          has(meta.footQuote)
            ? el("p", { class: "awards-foot__quote", text: "\u201C" + meta.footQuote + "\u201D" })
            : null,
          (meta.tags && meta.tags.length)
            ? el("p", { class: "awards-foot__tags", text: meta.tags.join(" \u00B7 ") })
            : null
        ])
      : null;

    return el("section", {
      class: "section" + (cfg.alt ? " section--alt" : "") + " section--awards",
      id: cfg.id, "aria-labelledby": cfg.id + "-title"
    }, [el("div", { class: "wrap" }, [head].concat(groups, [foot]))]);
  }

  /* -------------------------- academic services -------------------------- */
  function renderServices(cfg) {
    var items = SITE.services || [];
    if (!items.length) return null;

    var list = el("ul", { class: "svc-list" }, items.map(function (v) {
      /* The journal leads the card, so its name is the heading and links to
         the journal itself; "Peer Reviewer" sits under it as the role. */
      var name = has(v.url)
        ? el("a", { href: encodeURI(v.url), rel: "noopener", target: "_blank" }, [txt(v.org)])
        : txt(v.org);

      return el("li", { class: "card svc" }, [
        el("span", { class: "svc__mark" }, [
          safeImg(v.logo, (has(v.org) ? v.org : "Journal") + " logo", "svc__logo", monogram(v.org))
        ]),
        el("div", { class: "svc__body" }, [
          el("div", { class: "svc__head" }, [
            el("h3", { class: "svc__org" }, [name]),
            has(v.date) ? el("span", { class: "svc__date", text: v.date }) : null
          ]),
          el("p", { class: "svc__role" }, [txt(v.role)]),
          has(v.manuscript)
            ? el("p", { class: "svc__ms" }, [
                el("span", { class: "svc__ms-label", text: "Manuscript: " }),
                el("em", { text: "\u201C" + v.manuscript + "\u201D" })
              ])
            : null,
          has(v.note) ? el("p", { class: "svc__note", text: v.note }) : null,
          (v.link && has(v.link.href))
            ? el("p", { class: "svc__link" }, [
                el("a", {
                  href: encodeURI(v.link.href), rel: "noopener", target: "_blank",
                  "aria-label": (v.link.label || "ORCID record") + " for " +
                                (has(v.org) ? v.org : "this review")
                }, [icon("orcid", "ico"), el("span", { text: v.link.label || "ORCID" })])
              ])
            : null
        ])
      ]);
    }));

    return sectionShell(cfg, [list]);
  }

  /* ------------------------------- contact ------------------------------- */
  function renderContact(cfg) {
    var c = SITE.contact || {};
    var channels = (c.channels || []).filter(function (ch) { return has(ch.href); });
    if (!has(c.email) && !channels.length) return null;

    /* --- left column: heading, copy, the icon row --- */
    var heading = el("h2", { class: "contact-h2", id: "contact-title" }, [
      document.createTextNode("Get In "),
      el("span", { class: "accent", text: "Touch" })
    ]);

    var intro = el("div", { class: "contact-intro" }, [
      heading,
      has(c.lede) ? el("p", { class: "contact-lede", text: c.lede }) : null,
      has(c.note) ? el("p", { class: "contact-note", text: c.note }) : null,
      channels.length ? el("h3", { class: "contact-sub", text: "Connect with me" }) : null,
      channels.length ? el("ul", { class: "social-grid" }, channels.map(function (ch) {
        var ext = /^https?:/i.test(ch.href);
        return el("li", null, [
          el("a", {
            href: ch.href, "data-brand": has(ch.brand) ? ch.brand : null,
            rel: ext ? "noopener noreferrer" : null, target: ext ? "_blank" : null
          }, [
            el("span", { class: "social-grid__chip" }, [icon(ch.icon)]),
            el("span", { class: "social-grid__label", text: ch.label })
          ])
        ]);
      })) : null
    ]);

    /* --- middle column: the two detail cards --- */
    function infoCard(ic, label, value, note) {
      return el("div", { class: "info-card" }, [
        el("span", { class: "info-card__badge" }, [icon(ic)]),
        el("div", null, [
          el("p", { class: "info-card__label", text: label }),
          value,
          has(note) ? el("p", { class: "info-card__note", text: note }) : null
        ])
      ]);
    }

    var cards = el("div", { class: "contact-cards" }, [
      has(c.email)
        ? infoCard("mail", "Email",
            el("p", { class: "info-card__value" }, [
              el("a", { href: "mailto:" + c.email, text: c.email })
            ]), c.replyNote)
        : null,
      has(c.location)
        ? infoCard("pin", "Location",
            el("p", { class: "info-card__value", text: c.location }), c.locationNote)
        : null
    ]);

    /* --- right column: the handwritten line --- */
    var aside = has(c.script)
      ? el("div", { class: "contact-aside" }, [
          el("p", { class: "contact-script", text: c.script })
        ])
      : null;

    return el("section", {
      class: "section section--contact", id: cfg.id, "aria-labelledby": "contact-title"
    }, [el("div", { class: "wrap contact-layout" }, [intro, cards, aside])]);
  }

  /* -------------------------------- modal -------------------------------- */
  var modal = document.getElementById("image-modal");
  var modalImg = document.getElementById("modal-image");
  var modalCap = document.getElementById("modal-cap");
  var modalClose = document.getElementById("modal-close");
  var lastFocus = null;

  function openModal(src, alt, caption) {
    modalImg.src = src;
    modalImg.alt = alt || "";
    modalCap.textContent = caption || alt || "";
    lastFocus = document.activeElement;
    modal.hidden = false;
    document.body.style.overflow = "hidden";
    modalClose.focus();
  }
  function closeModal() {
    modal.hidden = true;
    modalImg.src = "";
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  modalClose.addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) {
    if (modal.hidden) return;
    if (e.key === "Escape") closeModal();
    /* The dialog has exactly one focusable control, so Tab simply stays put. */
    if (e.key === "Tab") { e.preventDefault(); modalClose.focus(); }
  });

  /* -------------------------------- chrome ------------------------------- */
  function renderChrome(present) {
    document.getElementById("brand").textContent = SITE.profile.fullName;

    var items = (SITE.nav || []).filter(function (n) {
      return present.indexOf(n.id) !== -1 && !n.navHidden;
    });
    var nav = document.getElementById("nav");
    var mob = document.getElementById("mobile-nav-list");

    items.forEach(function (n) {
      nav.appendChild(el("a", { href: "#" + n.id, text: n.label, "data-nav": n.id }));
      mob.appendChild(el("li", null, [el("a", { href: "#" + n.id, text: n.label, "data-nav-m": n.id })]));
    });

    var year = new Date().getFullYear(); /* computed — never hardcode a year */
    var foot = document.getElementById("footer-inner");

    foot.appendChild(el("p", { class: "foot__copy" }, [
      document.createTextNode("© " + year + " " + SITE.profile.fullName + "."),
      has(SITE.footerNote) ? document.createTextNode(" " + SITE.footerNote) : null
    ]));


  }

  function initMobileMenu() {
    var btn = document.getElementById("menu-btn");
    var panel = document.getElementById("mobile-nav");
    var label = btn.querySelector(".sr-only");

    function setOpen(open) {
      panel.hidden = !open;
      btn.setAttribute("aria-expanded", String(open));
      label.textContent = open ? "Close menu" : "Open menu";
    }
    btn.addEventListener("click", function () { setOpen(panel.hidden); });
    panel.addEventListener("click", function (e) { if (e.target.closest("a")) setOpen(false); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !panel.hidden) { setOpen(false); btn.focus(); }
    });
    window.addEventListener("resize", function () {
      if (window.innerWidth > 860 && !panel.hidden) setOpen(false);
    });
  }

  function initTheme() {
    var btn = document.getElementById("theme-toggle");
    var label = document.getElementById("theme-label");
    var root = document.documentElement;
    var mq = (typeof window.matchMedia === "function")
      ? window.matchMedia("(prefers-color-scheme: dark)") : null;

    function current() {
      var set = root.getAttribute("data-theme");
      if (set) return set;
      return (mq && mq.matches) ? "dark" : "light";
    }
    function sync() {
      var next = current() === "dark" ? "light" : "dark";
      label.textContent = "Switch to " + next + " theme";
      btn.setAttribute("title", "Switch to " + next + " theme");
      var m = document.getElementById("meta-theme-color");
      if (m) m.setAttribute("content", current() === "dark" ? "#0B1220" : "#FFFFFF");
    }
    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      sync();
    });
    if (mq && typeof mq.addEventListener === "function") mq.addEventListener("change", sync);
    sync();
  }

  function initScrollUi(ids) {
    var header = document.getElementById("site-header");
    var toTop = document.getElementById("to-top");

    function onScroll() {
      var y = window.scrollY || window.pageYOffset || 0;
      header.classList.toggle("is-stuck", y > 8);
      toTop.classList.toggle("is-on", y > 420);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    toTop.addEventListener("click", function () {
      var reduced = typeof window.matchMedia === "function" &&
                    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
    });

    if (!("IntersectionObserver" in window)) return;

    var links = {};
    document.querySelectorAll("[data-nav], [data-nav-m]").forEach(function (a) {
      var id = a.getAttribute("data-nav") || a.getAttribute("data-nav-m");
      (links[id] = links[id] || []).push(a);
    });

    function setActive(id) {
      Object.keys(links).forEach(function (k) {
        links[k].forEach(function (a) {
          if (k === id) a.setAttribute("aria-current", "true");
          else a.removeAttribute("aria-current");
        });
      });
    }

    var targets = ids.map(function (id) { return document.getElementById(id); }).filter(Boolean);
    var seen = new Map();
    var spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) seen.set(en.target.id, en.intersectionRatio);
        else seen.delete(en.target.id);
      });
      var best = null;
      targets.forEach(function (t) {
        if (seen.has(t.id) && (best === null || seen.get(t.id) > seen.get(best))) best = t.id;
      });
      setActive(best);
    }, { rootMargin: "-20% 0px -65% 0px", threshold: [0, 0.1, 0.35, 0.7] });

    targets.forEach(function (t) { spy.observe(t); });
  }

  /* ------------------------------ head sync ------------------------------ */
  function syncHead() {
    var m = SITE.meta;
    if (!m) return;
    document.title = m.title;
    [['meta[name="description"]', "content", m.description],
     ['meta[property="og:title"]', "content", m.title],
     ['meta[property="og:description"]', "content", m.description],
     ['meta[property="og:url"]', "content", m.url],
     ['meta[property="og:image"]', "content", m.ogImage],
     ['meta[name="twitter:title"]', "content", m.title],
     ['meta[name="twitter:description"]', "content", m.description],
     ['meta[name="twitter:image"]', "content", m.ogImage],
     ['link[rel="canonical"]', "href", m.url]
    ].forEach(function (r) {
      var node = document.querySelector(r[0]);
      if (node && has(r[2])) node.setAttribute(r[1], r[2]);
    });
  }

  function renderJsonLd() {
    var p = SITE.profile;
    var urls = (SITE.actions || [])
      .concat((SITE.contact && SITE.contact.channels) || [])
      .map(function (l) { return l.href; })
      .filter(function (h) { return has(h) && /^https?:/i.test(h); });
    urls = urls.filter(function (h, i) { return urls.indexOf(h) === i; });

    var data = {
      "@context": "https://schema.org",
      "@type": "Person",
      name: p.fullName,
      url: SITE.meta.url,
      jobTitle: p.role,
      description: SITE.meta.description,
      knowsAbout: p.interests,
      affiliation: {
        "@type": "CollegeOrUniversity",
        name: "Jeju National University",
        address: { "@type": "PostalAddress", addressLocality: "Jeju", addressCountry: "KR" }
      },
      alumniOf: (SITE.education || [])
        .filter(function (e) { return has(e.role); })
        .map(function (e) { return { "@type": "CollegeOrUniversity", name: e.role }; }),
      sameAs: urls
    };
    if (has(p.photo)) { try { data.image = new URL(p.photo, SITE.meta.url).href; } catch (e) {} }
    if (SITE.contact && has(SITE.contact.email)) data.email = "mailto:" + SITE.contact.email;

    var s = document.createElement("script");
    s.type = "application/ld+json";
    s.textContent = JSON.stringify(data, null, 2);
    document.head.appendChild(s);
  }

  /* -------------------------------- boot --------------------------------- */
  function safely(label, fn) {
    try { return fn(); }
    catch (err) { console.error("[site] " + label + " failed:", err); return null; }
  }

  var BUILDERS = {
    news:         renderNewsSection,
    awards:       renderAwards,
    projects:     renderProjects,
    publications: renderPublications,
    experience:   renderExperience,
    services:     renderServices,
    education:    renderEducation,
    contact:      renderContact
  };

  function boot() {
    safely("head", syncHead);

    var main = document.getElementById("main");
    var hero = safely("hero", renderHero);
    if (hero) main.appendChild(hero);

    var present = [];
    (SITE.nav || []).forEach(function (cfg) {
      var build = BUILDERS[cfg.id];
      if (!build) return;
      var node = safely(cfg.id, function () { return build(cfg); });
      if (node) { main.appendChild(node); present.push(cfg.id); }
    });

    safely("chrome", function () { renderChrome(present); });
    safely("menu", initMobileMenu);
    safely("theme", initTheme);
    safely("scroll", function () { initScrollUi(["top"].concat(present)); });
    safely("jsonld", renderJsonLd);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
